  // The mouths know only how to make noise. Everything about turns, queueing, when the
  // sound really stopped and how long to stay deaf afterwards lives in the one gate
  // above them, so both voices — and anything we add later — obey the same rules.
  const mouth = oneVoice({
    mouth:
      setup.speaker === "mac"
        ? macMouth({ fallback: phoneVoice, onTrouble: (m) => log(m, "bad") })
        : phoneVoice,
    settleMs: setup.settleAfterSpeaking ?? 900,
    ...talking,
  });

  // One running transcript of everything you have said since the last question went
  // off. It is always being written to, it is always on the screen, and nothing
  // removes anything from it except sending it. A pause is a person thinking.
  //
  // Each piece is kept twice over: exactly as heard, and tidied up. The two must not
  // be confused. Everything that listens for a command, or checks whether it is
  // hearing its own voice back, works on the words as heard — those decisions are
  // made by sound, and handing them a rewrite would break them. The tidied version is
  // only what goes on the screen and what finally goes to Claude. A piece whose
  // tidy-up has not come back yet, or came back untrustworthy, simply shows and sends
  // as heard, which is exactly what happened before any of this existed.
  const reader = makePhraseReader(setup.phrases);
  let question = [];    // [{ heard, tidied }] — tidied is null until it comes back

  const asHeard = (pieces = question) => pieces.map((p) => p.heard).join(" ");
  const asTidied = (pieces = question) => pieces.map((p) => p.tidied ?? p.heard).join(" ");

  // Whatever the question was before the last thing that emptied it. A misheard
  // command is going to happen — no amount of matching makes that impossible — so
  // the answer is not to guess better but to make guessing wrong cost nothing.
  // Taking it back puts the words straight back.
  let lastEmptied = [];

  // The tidy-ups still out at the Mac. Sending waits on these, but only for a moment:
  // the point of tidying at every pause is that the wait is a fraction of one breath
  // rather than the whole ramble, and a tidy-up that is late is not worth a pause in
  // front of somebody who has just said "send it".
  const tidying = new Set();
  const WAIT_FOR_TIDYING_MS = 1_200;

  // A piece goes on the screen the instant it is heard, and quietly improves a moment
  // later if the Mac has something better. It is put back in its own place rather than
  // on the end, because by the time it lands there may be more sentences after it.
  function tidyUp(piece) {
    const job = fetch("/tidy", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ heard: piece.heard }),
    })
      .then((answer) => answer.json())
      .then(({ text, changed }) => {
        piece.tidied = String(text ?? piece.heard);
        if (changed) trace("tidied", `${piece.heard} -> ${piece.tidied}`);
      })
      .catch(() => { piece.tidied = piece.heard; })   // never a reason to lose words
      .finally(() => { tidying.delete(job); show(); });
    tidying.add(job);
  }

  // The one way words get added to the question. Kept as heard, tidied in the
  // background, on the screen either way. A bare "yes" needs no tidying and is on its
  // way to Claude the instant it is said, so it skips the whole business.
  function remember(heard, { tidy = true } = {}) {
    const piece = { heard, tidied: tidy ? null : heard };
    question.push(piece);
    if (tidy) tidyUp(piece);
    return piece;
  }
  let toldAboutTheNewPage = false;
  // Everything it has done since it last said anything. Emptied when it speaks, so
  // what gets said is always the whole of the gap and never one step out of forty.
  let sinceLastUpdate = [];
  let lastSaidSoFar = "";      // the last summary spoken, so it is not said twice
  let lastSaidSoFarAt = 0;
  let workStartedAt = 0;       // when the question went, so a long wait can be known

  // A long wait deserves a word, but a voice that narrates every step is worse than
  // the silence it replaced. So it speaks on a clock rather than on events, and what
  // it says covers everything that happened while it was quiet.
  let askingSoFar = false;

  async function sayWhereItIsUpTo() {
    if (!working || askingSoFar) return;
    if (mouth?.busy) return;                      // never talk over itself
    const gap = setup.saySoFarEvery ?? 30_000;
    if (Date.now() - lastSaidSoFarAt < gap) return;

    // The counted-up version of the steps, which needs nothing and never fails. It is
    // the floor, not the aim: what the Mac writes is better whenever it manages it.
    const counted = whatHappened(sinceLastUpdate);
    sinceLastUpdate = [];

    // The Mac has the whole account — what each step came back with, not just its
    // name — and a model there turns it into a sentence about what is going on. It is
    // allowed to take a second or two, because this is said while waiting anyway.
    askingSoFar = true;
    let summary = "";
    try {
      const answer = await fetch("/so-far", { method: "POST" }).then((r) => (r.ok ? r.json() : null));
      summary = String(answer?.summary ?? "").trim();
    } catch {
      // No answer is not a problem: the counted version below says something true.
    }
    askingSoFar = false;

    const say = summary || counted;
    if (!say || say === lastSaidSoFar) return;
    if (!working || mouth?.busy) return;          // it finished, or started talking
    lastSaidSoFar = say;
    lastSaidSoFarAt = Date.now();
    trace("saying where it is up to", summary ? say : `${say} (counted, no summary)`);
    mouth?.speak(say);
  }
  let live = "";        // the words being said right this second, not settled yet
  let working = false;
  let ears = null;

  // Offering to send, once what you have said sounds like a finished sentence. The
  // send phrase is still the certain way; this is about not needing it every time.
  //
  // It offers rather than sends, and it waits a beat before offering, because the two
  // ways this goes wrong are opposites. "Check the tests and" is caught by the words
  // themselves. "Look at the tests." … "Also the migrations." is a finished sentence
  // that was still going, and no reading of the words can tell — only waiting can, so
  // anything you say next calls the offer off before it is made.
  let offerTimer = null;
  let declined = 0;      // asked and told no, on the question as it stands

  // When words last arrived, so an offer can insist on real silence rather than on a
  // timer that started before you had finished the sentence.
  let lastHeardAt = 0;
  let offering = false;

  function stopOffering() {
    if (offerTimer) { clearTimeout(offerTimer); offerTimer = null; }
  }

  // How long to wait before asking, given what the words look like and what the model
  // made of the whole question so far. Three lengths rather than two, because there
  // are three answers: it reads as finished, it reads as unfinished, and there is
  // somebody still building a list out of finished-looking sentences.
  //
  // The model's no counts for more than its yes, on purpose. Asking too early takes an
  // action against half a question; waiting too long costs a beat and the send phrase,
  // which is what happens today anyway. So "more is coming" pushes the wait right out,
  // while "sounds finished" only shortens a long wait — it never overrides the words.
  function waitBefore(finished, more, short) {
    const briskly = setup.offerAfterShort ?? 500;
    const soon = setup.offerAfter ?? 1_500;
    const eventually = setup.offerAfterPause ?? 10_000;
    if (more === true) return eventually;
    // A few words and then quiet, and that is the whole of it. Whether they read as a
    // finished sentence is deliberately not asked here: nobody speaks in finished
    // sentences at the wheel, and a test for one was refusing perfectly ordinary
    // half-said questions that were plainly all somebody was going to say.
    //
    // What makes this safe is not the words, it is the shortness and the silence
    // together — and that it only ever offers. Carry on talking and the offer is called
    // off before it is made, exactly as before. In practice the Mac's opinion does not
    // come back in time to change this one, which is the trade being made on purpose:
    // a second opinion slower than the wait it would shorten is no use here.
    if (short) return briskly;
    if (finished) return soon;
    if (more === false) return setup.offerAfterThought ?? 3_000;
    return eventually;
  }

  // Ask the Mac what it makes of the pause. Costs nothing when the model is not there:
  // no answer means no opinion, and no opinion is exactly today's behaviour.
  function askAboutThePause(said) {
    return fetch("/still-talking", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ said }),
    })
      .then((r) => (r.ok ? r.json() : null))
      .then((r) => (typeof r?.more === "boolean" ? r.more : null))
      .catch(() => null);
  }

  function maybeOfferToSend() {
    stopOffering();
    // Twice told no is a person who wants to keep talking. Stop asking until this
    // question is out of the way; nagging is worse than needing the phrase.
    if (declined >= 2) return;
    if (waitingOn || working) return;
    if (reader.held()) return;                       // a command may still be forming
    if (!question.length) return;

    // Two clocks, and the words decide which one. A sentence that sounds finished only
    // has to survive a beat before it is worth asking about. One that does not sound
    // finished still gets asked about eventually, because "and then the other thing"
    // left hanging for ten seconds is far more often someone who has stopped talking
    // than someone mid-thought — and the cost of asking is one word.
    // Judged on the words as heard, not the tidy-up. The tidy-up puts a full stop on
    // the end of everything, and this is a test for a full stop.
    const said = asHeard();
    const finished = soundsFinished(said);
    const short = justAFewWords(said, setup.aFewWords ?? 6);
    // How long this particular pause is being given. Kept where the offer can see it,
    // because the wait and the quiet it insists on are the same judgement: there is no
    // sense asking after half a second and then refusing to speak until a second of
    // silence has gone by.
    let waited = waitBefore(finished, null, short);
    const offer = () => {
      offerTimer = null;
      if (waitingOn || working || live || reader.held()) return;
      if (!question.length) return;
      // Talking underneath its own voice is the one thing that makes an offer worse
      // than useless, so it waits for quiet rather than cutting in.
      if (mouth?.busy) { offerTimer = setTimeout(offer, 500); return; }
      // Silence means silence: no words in the air, and none arriving. Dictation reports
      // a settled piece a beat after you stop, so an offer timed from the last settled
      // piece could land while you were plainly still in mid-sentence — and then, being
      // its own voice, it made everything deaf and swallowed the rest of what you said.
      const quietFor = Date.now() - lastHeardAt;
      const needed = Math.min(setup.quietBeforeOffering ?? 1_200, waited);
      if (quietFor < needed) { offerTimer = setTimeout(offer, needed - quietFor); return; }
      trace("OFFERING TO SEND", asTidied());
      offering = true;
      askYesNo("Send that?", send, () => {
        declined += 1;
        trace("offer declined", `${declined}`);
        sound.note("declined");
      });
      // Two words of its own, and only for a moment. Long enough that carrying on
      // talking cancels it, short enough that it cannot be mistaken for an answer.
      setTimeout(() => { offering = false; }, setup.offerStaysOpen ?? 4_000);
    };

    // The clock starts on the words alone, so nothing waits on the Mac to answer. The
    // model's opinion arrives a fraction of a second later and moves the clock — which
    // is only ever worth doing while this is still the same question and the offer has
    // not already been made. Anything said in the meantime has cancelled all of it.
    const startedAt = Date.now();
    offerTimer = setTimeout(offer, waited);
    askAboutThePause(said).then((more) => {
      if (more === null || !offerTimer) return;
      if (asHeard() !== said) return;
      waited = waitBefore(finished, more, short);
      const left = waited - (Date.now() - startedAt);
      trace("the pause", more ? "he is mid-thought, holding off" : "sounds like a finished thought");
      clearTimeout(offerTimer);
      offerTimer = setTimeout(offer, Math.max(300, left));
    });
  }

  function show() {
    const settled = [asTidied(), reader.held()].filter(Boolean).join(" ");
    promptEl.textContent = settled;
    if (live) {
      const tail = document.createElement("span");
      tail.className = "live";
      tail.textContent = `${settled ? " " : ""}${live}`;
      promptEl.append(tail);
    }
    promptEl.scrollTop = promptEl.scrollHeight;
    paint();
    // The reminder is about silence, so its clock starts again from every change on
    // the screen. Nothing changing is exactly the case it exists for.
    waitingForYou();
  }

  function paint() {
    // Being held off has to be obvious at a glance. Nothing arriving looks exactly like
    // dictation having died, and the difference between "it is ignoring you on purpose"
    // and "it is broken" is not something anybody should have to work out while driving.
    if (heldOff) { goBtn.textContent = "Paused"; goBtn.className = "paused"; }
    // Says what tapping does, rather than what it thinks it is. "Quiet" read as a
    // status — as in it has gone quiet — which is the opposite of the truth at that
    // moment, so you tapped expecting to wake it and silenced it instead.
    else if (mouth?.busy) { goBtn.textContent = "Stop talking"; goBtn.className = "talking"; }
    else if (question.length) { goBtn.textContent = "Send"; goBtn.className = "open"; }
    else { goBtn.textContent = "Listening"; goBtn.className = "live"; }
  }

  function idleState() {
    if (working) { setState("working — talk whenever you like"); return; }
    setState(
      question.length
        ? `say "${setup.phrases.send}" to send it. No hurry.`
        : `listening — nothing recorded yet`,
    );
  }

  // Everything that was said, sent as one. This is the only thing that empties the
  // screen, and it only ever happens because you asked for it.
  async function send() {
    stopOffering();
    declined = 0;
    // If you named a project in the same breath, that has to land first.
    if (switching) { trace("waiting for the project to change"); await switching; }

    if (!question.length) {
      // Nothing to send means you wanted quiet: hush, and drop what is running.
      mouth?.silence();
      if (working) { stopWork(); working = false; stopTicking(); log("stopped", "work"); }
      sound.note("wiped");
      idleState();
      return;
    }

    // The last thing said is usually still being tidied, because it was said a second
    // ago. Everything before it was done during the pauses. So this is a wait of a
    // fraction of a sentence, and it gives up rather than hold anybody up.
    if (tidying.size) {
      trace("waiting on the tidy-up", `${tidying.size} still out`);
      await Promise.race([
        Promise.allSettled([...tidying]),
        new Promise((done) => setTimeout(done, WAIT_FOR_TIDYING_MS)),
      ]);
    }

    const asked = asTidied().trim();
    if (!asked) { idleState(); return; }
    // Every piece has been through the Mac already, so the whole thing must not be put
    // through a second time — that second pass is the delay this was built to remove.
    const alreadyTidied = question.every((p) => p.tidied !== null);

    sound.note("sent");
    trace("SENDING", asked);
    lastEmptied = question;
    question = [];
    live = "";
    show();
    yourLastLine = log(`you: ${asked}`, "you");

    working = true;
    // A new question starts the clock over, so the first thing it does gets said
    // promptly rather than being held back by an update from the last question.
    sinceLastUpdate = [];
    lastSaidSoFar = "";
    lastSaidSoFarAt = Date.now();
    workStartedAt = Date.now();
    keepTicking();
    setState("thinking…");
    // Whatever was still to be said about the last question is dropped. An answer that
    // took a while can land a second after you have already moved on, and hearing the
    // reply to your previous question read out after your latest one is worse than
    // silence: it sounds like the app reciting something old, and there is no way from
    // the driver's seat to tell which question you are hearing about. Asking something
    // new is as clear a statement as there is that you are done with the last one.
    mouth?.silence();
    // The sound alone says "gone", and on a road with the windows down it is easy to
    // half-hear or miss. A word says the same thing in a way that cannot be mistaken
    // for a road noise, and it is one word so it is out of the way before the answer
    // starts coming back.
    mouth?.speak("Thinking");
    ask(asked, { alreadyTidied }).catch((err) => log(String(err.message ?? err), "bad"));
  }

  function wipe() {
    stopOffering();
    declined = 0;
    trace("WIPED", asHeard());
    lastEmptied = question;
    question = [];
    live = "";
    mouth?.silence();      // saying it is also how you cut it off
    sound.note("wiped");
    show();
    setState("wiped — start again whenever you like");
  }

  // Everything you can say that is an instruction rather than part of the question.
  // Adding one is a line here and a line in the settings on the Mac.
  function obey(command, spokenAs = "") {
    trace("COMMAND", command);
    if (command === "send") return send();
    if (command === "wipe") return wipe();
    if (command === "read") return readBack();
    if (command === "undo") return dropLast();
    if (command === "forget") return forgetTheDrive();
    if (command === "where") return sayWhere();
    if (command === "restart") return startAppAgain();
    if (command === "update") return takeTheNewPage();
    if (command === "project") { awaitingProject = spokenAs; return; }
    if (command === "help") return sayWhatYouCanSay();
    if (command === "remote") return handToRemoteControl();
    if (command === "pause") return holdOff();
    if (command === "resume") return listenAgain();
  }

  // Held off: it keeps listening, because it has to hear the one thing that brings it
  // back, but nothing else gets through — not into the question, not onto the screen,
  // not to a command. For a car full of talk that was never meant for it, this is the
  // only honest answer: no amount of cleverness tells a passenger from you.
  let heldOff = false;

  function holdOff() {
    heldOff = true;
    stopWaitingNote();
    trace("holding off");
    setState("paused — say “hey unpause” to come back");
    paint();
    mouth?.speak("Not listening. Say unpause when you want me back.");
  }

  function listenAgain() {
    heldOff = false;
    trace("listening again");
    waitingForYou();
    mouth?.speak("Listening again.");
    idleState();
    paint();
  }

  // --------------------------------------------- questions the phone itself asks
  //
  // Anything long is worse read out in one go than not read out at all: by the third
  // item you have lost the first, and you are driving. So nothing here says more than
  // a couple of things before stopping to ask whether you want the rest.
  //
  // The awkward part was answering. Every other way of talking to this needs a send
  // phrase on the end, which for the word "yes" is more to remember than the answer
  // itself. So while it is waiting on a question it asked, a bare yes or no counts on
  // its own. The window is narrow and it shuts on the first thing you say, whatever
  // that is — so ordinary speech is never sitting inside it.
  let waitingOn = null;      // { onYes, onNo } while a question of its own is open
  let waitTimer = null;
  let turnTimer = null;
  // Whether they carried on talking instead of answering. Someone who has moved on
  // does not need to be told, with a beep, that the thing they ignored has closed.
  let saidSomethingSince = false;

  function stopWaiting() {
    if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
    if (turnTimer) { clearTimeout(turnTimer); turnTimer = null; }
    waitingOn = null;
  }

  // Whether a bare yes will land is invisible from the driver's seat, and getting it
  // wrong is expensive: you say "yes", nothing happens, and the word quietly becomes
  // part of your next question instead. So the window announces itself. It is not
  // sounded when it opens but when it becomes usable — the moment the talking stops —
  // because a note played underneath its own voice is one more thing to talk over.
  function blipWhenItIsYourTurn() {
    // Nothing. The window only ever opens behind a spoken question — "send that?", or
    // a question at the end of an answer — and a question is already an invitation to
    // answer it. A note on top of it said the same thing twice, and the second time
    // was a beep in the ear of somebody who had just been asked something.
  }

  function waitForAnswer(onYes, onNo) {
    waitingOn = { onYes, onNo };
    saidSomethingSince = false;
    if (waitTimer) clearTimeout(waitTimer);
    blipWhenItIsYourTurn();
    const window = setup.answerWindow ?? 25_000;

    // The clock is on your thinking time, and thinking time starts when the talking
    // stops. Merely pausing the clock while it speaks is not enough — a long answer
    // uses the whole window up before the question has even been asked, and then the
    // window shuts the moment the last word lands. That is what happened: the window
    // closed three seconds before an answer that was given straight away.
    //
    // So every moment it is still talking pushes the deadline out afresh. However
    // long the answer, you get the full window after it, and the short gaps between
    // one sentence and the next cannot be mistaken for silence.
    let deadline = Date.now() + window;
    const closeUnlessStillTalking = () => {
      if (mouth?.busy) {
        deadline = Date.now() + window;
        waitTimer = setTimeout(closeUnlessStillTalking, 500);
        return;
      }
      const left = deadline - Date.now();
      if (left > 0) { waitTimer = setTimeout(closeUnlessStillTalking, Math.min(500, left)); return; }
      trace("stopped waiting", "no answer");
      // Say so, but only into silence. Someone who has said nothing at all cannot tell
      // an open window from a shut one, and the cost of guessing wrong is saying "yes"
      // into nothing. Someone who has been talking has already moved on — and telling
      // them the window shut, while they are mid-sentence, is the beep that made this
      // worth changing.
      if (!saidSomethingSince) sound.note("tooLate");
      stopWaiting();
    };
    waitTimer = setTimeout(closeUnlessStillTalking, 500);
  }

  function askYesNo(spoken, onYes, onNo) {
    mouth?.speak(spoken);
    waitForAnswer(onYes, onNo);
  }

  // Claude asks things too — "want the next one?" — and answering those was the whole
  // complaint: saying "yes" and then the send phrase is more to remember than the
  // answer. So the same window opens when an answer it has just read ENDS in a
  // question.
  //
  // Read off the answer itself rather than set by Claude deliberately. Claude marking
  // its own questions would work right up until it forgot, and a shortcut that works
  // most of the time is worse than one that works for a reason. A question mark is
  // there or it is not.
  //
  // Being wrong here costs nothing either way. A question it misses just needs the
  // send phrase, the way everything does today. A question it imagines opens a window
  // that shuts again the moment you say anything that is not yes or no — and those
  // words go into your question untouched, exactly as they would have.
  const endsWithAQuestion = (text) => /\?\s*$/.test(String(text ?? "").trim());

  // A bare yes or no is the whole answer: it goes off on its own, no send phrase. It
  // joins anything already dictated rather than replacing it, so a yes said after a
  // half-built question adds to it instead of quietly throwing it away.
  function answerClaude(word) {
    remember(word, { tidy: false });
    show();
    send();
  }

  const saidExactly = (text, wordings) => {
    const said = plainWords(text).join(" ");
    if (!said) return false;
    return [wordings].flat().some((wording) => plainWords(wording).join(" ") === said);
  };

  // Is this the whole of an answer to a question it asked, and nothing else? Asked
  // separately from acting on it, because the echo test upstream has to know.
  const isBareAnswer = (text) =>
    Boolean(waitingOn) &&
    (saidExactly(text, setup.answers?.yes ?? []) || saidExactly(text, setup.answers?.no ?? []));

  // Whole utterance only. "yes" is an answer; "yes and check the tests" is a
  // sentence, and goes where sentences go. Either way the waiting is over.
  function answerGiven(text) {
    if (!waitingOn) return false;
    const said = plainWords(text).join(" ");
    if (!said) return false;

    const { onYes, onNo } = waitingOn;
    stopWaiting();
    if (saidExactly(text, setup.answers?.yes ?? [])) { trace("ANSWERED", "yes"); onYes?.(); return true; }
    if (saidExactly(text, setup.answers?.no ?? [])) { trace("ANSWERED", "no"); onNo?.(); return true; }
    saidSomethingSince = true;
    trace("stopped waiting", `said something else: ${said}`);
    return false;   // not an answer — carry on and treat it as speech
  }

  // Read a list out a couple at a time, asking between each lot. Written for the
  // command list but deliberately knows nothing about commands, because everything
  // this thing reads aloud has the same problem.
  function readOutInTurn(items, { intro = "", done = "That's all of them." } = {}) {
    const size = Math.max(1, setup.readOutPage ?? 2);
    let at = 0;
    const more = () => {
      // The intro rides on the first lot rather than being said separately: two
      // sentences spoken as two goes means the second one cuts the first one off.
      const lot = [at === 0 ? intro : "", ...items.slice(at, at + size)].filter(Boolean);
      at += Math.min(size, items.length - at);
      const left = items.length - at;
      const spoken = lot.join(" ");
      log(spoken, "work");
      if (left > 0) askYesNo(`${spoken} That's ${left} more. Want them?`, more, () => mouth?.speak("Right you are."));
      else mouth?.speak(`${spoken} ${done}`);
    };
    return more;
  }

  // What you can say, said out loud. Answered here rather than by Claude, because
  // the moment you cannot remember a command is the worst moment to wait a minute
  // for an answer — and because asking Claude means first saying the send phrase,
  // which is one of the things you have just forgotten.
  //
  // Built from the commands themselves, so one added in the settings on the Mac
  // turns up here without this function being touched. A command with no
  // description still gets read out, with its wordings and no explanation: a help
  // list that quietly omits a command is the failure worth designing against.
  function sayWhatYouCanSay() {
    const says = (wordings) => {
      const all = [wordings].flat();
      if (all.length === 1) return `say "${all[0]}"`;
      return `say "${all.slice(0, -1).join('", "')}", or "${all[all.length - 1]}"`;
    };
    const described = Object.entries(setup.phrases ?? {}).map(([name, wordings]) => {
      const does = (setup.whatEachDoes ?? {})[name];
      return does ? `To ${does}, ${says(wordings)}.` : `And ${says(wordings)}.`;
    });
    trace("HELP", `${described.length} commands`);
    mouth?.silence();
    readOutInTurn(described, { intro: `There are ${described.length}.` })();
  }

  // "work on the voice app" — the words after the phrase name the project, so the
  // next thing said is taken as the name rather than added to the question.
  // The words of the phrase just said, while we wait to see whether a project name
  // follows. Null when we are not waiting.
  let awaitingProject = null;

  // A project is named at the front of what follows, and the rest is the question:
  // "work on the voice app and check the tests" is a switch and then a question, not
  // a project with a sentence stuck to it. So this takes the longest name that fits
  // the opening words and hands back whatever is left over.
  function projectAtTheFront(said) {
    const bare = (text) => text.toLowerCase().replace(/^(the|my)\s+/, "").trim();
    const spoken = bare(said);
    if (!spoken) return null;

    for (const { said: name, name: realName } of setup.projectNames ?? []) {
      const wanted = bare(name);
      if (spoken === wanted) return { project: realName, rest: "" };
      if (spoken.startsWith(`${wanted} `)) {
        return { project: realName, rest: said.slice(said.length - (spoken.length - wanted.length)).trim() };
      }
    }

    // No name landed whole. Dictation mangles them — the app's own name came back as
    // "the clot voice app" — so fall back to the word that gives a project away.
    //
    // It has to be at the very front, with nothing but filler before it. A giveaway
    // word further into a sentence is just a word, and mistaking one for a name would
    // turn an ordinary question into a switch.
    const FILLER = new Set(["the", "my", "a", "an", "to", "on", "over", "onto", "into"]);
    const PART_OF_A_NAME = new Set(["app", "apps", "application", "project", "code", "one", "thing"]);
    const words = spoken.split(/\s+/);

    let at = 0;
    while (at < words.length && FILLER.has(words[at])) at += 1;
    if (at >= words.length) return null;

    for (const [project, giveaways] of Object.entries(setup.giveaways ?? {})) {
      const gives = (word) => giveaways.some((giveaway) => nearlySame(word, giveaway));
      if (!gives(words[at])) continue;

      // The name may run on — "clot voice app" is three words for one project — so
      // everything that is still plainly part of the name is swallowed with it, and
      // what is left is the question.
      let after = at + 1;
      while (after < words.length && (gives(words[after]) || PART_OF_A_NAME.has(words[after]))) {
        after += 1;
      }
      return { project, rest: words.slice(after).join(" ") };
    }

    return null;
  }

  // Changing this app's code by talking to it does nothing until it starts again,
  // and there is nobody at the keyboard to do it. It comes back on its own; the page
  // simply waits, because the link to the Mac reconnects by itself.
  // Loading the new page costs the sound channel, so it is never done to you while
  // you are mid-drive — it is offered, and you take it when you are ready.
  function takeTheNewPage() {
    if (!newPageWaiting) {
      mouth?.speak("There is no new page waiting. This is the current one.");
      return;
    }
    mouth?.speak("Loading it. Tap the button once to get my voice back.");
    // Long enough to be heard, since the page is about to be replaced mid-sentence.
    setTimeout(() => loadTheNewPage(asTidied()), 3_500);
  }

  async function startAppAgain() {
    mouth?.silence();
    mouth?.speak("Starting again.");
    trace("ASKED FOR A RESTART");
    try {
      await fetch("/restart", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ why: "asked out loud" }),
      });
    } catch {
      // It went down before it could answer, which is exactly what was asked for.
    }
  }

  function sayWhere() {
    mouth?.silence();
    mouth?.speak(`We are on ${setup.project}.`);
  }

  // A question said in the same breath as the switch must not go to the project you
  // just left, so sending waits for this to land.
  let switching = null;

  // Naming the project you are already on is not a change of project. Announcing it
  // is a confirmation of nothing, and — worse — the clearing below would throw away
  // everything said in the same breath, so the instruction has to be given twice.
  // Both happened: "work on the voice app" while on the voice app ate the sentence
  // it was attached to.
  async function switchTo(name, rest = "") {
    awaitingProject = null;
    if (name === setup.project) {
      trace("ALREADY THERE", name);
      if (rest) {
        remember(rest);
        trace("keeping", rest);
      } else {
        mouth?.speak(`Already on ${name}.`);
      }
      return;
    }
    mouth?.silence();
    let landed;
    switching = new Promise((resolve) => { landed = resolve; });
    try {
      const answer = await fetch("/project", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const result = await answer.json();

      if (!answer.ok) {
        trace("UNKNOWN PROJECT", name);
        log(`no project called "${name}"`, "bad");
        mouth?.speak(`I don't know ${name}. I know ${(result.projects ?? []).join(", ")}.`);
        return;
      }

      // Everything said before this was aimed at the old project, so it goes with it.
      setup.project = result.project;
      question = [];
      live = "";
      // What came after the switch was aimed at the new project, so it survives the
      // clearing. It is put back here rather than by the caller because the clearing
      // happens after the round trip, and would otherwise wipe it a moment later.
      if (rest) {
        remember(rest);
        trace("keeping", rest);
      }
      show();
      trace("PROJECT", result.project);
      log(`now working on ${result.project}`, "work");
      sound.note("sent");
      mouth?.speak(`Now working on ${result.project}. Anything else I do is in there.`);
    } catch (err) {
      log(String(err.message ?? err), "bad");
    } finally {
      landed();
      switching = null;
    }
  }

  // The end of the drive, or the middle of it. Everything else here is for someone
  // who cannot look at anything; this is the one thing that hands the work to
  // somebody who can.
  async function handToRemoteControl() {
    trace("COMMAND", "remote control");
    log("handing this over to remote control", "work");
    try {
      const answer = await fetch("/remote-control", { method: "POST" }).then((r) => r.json());
      log(answer.say, answer.started ? "work" : "bad");
      mouth?.speak(answer.say);
    } catch (err) {
      const trouble = `I couldn't reach the Mac to do that. ${err.message ?? err}`;
      log(trouble, "bad");
      mouth?.speak(trouble);
    }
  }

  // Claude remembers the whole drive, which is what makes "and the tests?" mean
  // something. This is how you tell it to stop remembering.
  function forgetTheDrive() {
    stopOffering();
    declined = 0;
    forgetDrive();
    lastEmptied = question;
    question = [];
    live = "";
    show();
    log("forgot the drive so far", "work");
    mouth?.silence();
    sound.note("wiped");
    mouth?.speak("Forgotten. Starting fresh.");
  }

  // Work takes anywhere from ten seconds to a few minutes, and silence for that long
  // is indistinguishable from something having gone wrong. So it says quietly that it
  // is still there — soft, and not often enough to become wallpaper.
  let tick = null;
  function keepTicking() {
    stopTicking();
    tick = setInterval(() => {
      // No note while it works. It was meant to say "still here" during a long wait, but
      // a beep every ten seconds for two minutes is not reassurance, it is nagging — and
      // it says nothing you cannot see on the screen or hear when the answer arrives.
      // On the clock as well as on events, or a single slow step would swallow
      // everything that led up to it and say none of it until the next thing happened.
      sayWhereItIsUpTo();
    }, 10_000);
  }
  function stopTicking() {
    clearInterval(tick);
    tick = null;
  }

  // The other silence: nothing recorded, nothing running, nobody talking. From the
  // driver's seat that is indistinguishable from dictation having quietly died, and
  // there is no way to check without looking. So it says so on the same clock the
  // working note uses, a pitch above it, and stays out of the way of everything
  // else — it never lands over its own voice, over a question it has asked, or
  // while there are words on the screen waiting to be sent.
  //
  // It waits a long time before the first one, and that is the whole of what makes it
  // bearable. Quiet ten seconds after an answer is not a silence anybody could mistake
  // for a fault — it is the ordinary gap between one thing and the next, and a note
  // there is an interruption dressed up as reassurance. The silence worth breaking is
  // the one that has gone on long enough to make you wonder, and that takes minutes,
  // not seconds. Afterwards it repeats slowly, because by then the question is "are
  // you still there" and that only needs answering now and again.
  let waitingTick = null;
  let waitingFirst = null;
  function waitingForYou() {
    stopWaitingNote();
    const note = () => {
      // Guarded here as well as stopped on the way in, because anything that settles the
      // screen starts this clock again — so stopping it once was not enough and the note
      // came back a few seconds after being paused.
      if (heldOff) return;
      if (working || waitingOn || mouth?.busy) return;
      if (question.length || live || reader.held()) return;
      sound.note("waiting");
    };
    waitingFirst = setTimeout(() => {
      note();
      waitingTick = setInterval(note, setup.waitingNoteEvery ?? 30_000);
    }, setup.waitingNoteAfter ?? 180_000);
  }
  function stopWaitingNote() {
    clearTimeout(waitingFirst);
    clearInterval(waitingTick);
    waitingFirst = null;
    waitingTick = null;
  }

  // Says back what it has so far. Its own voice is filtered out of what it hears,
  // so reading the question aloud cannot end up recorded as part of the question.
  function readBack() {
    const soFar = asTidied().trim();
    trace("READING BACK", soFar || "(nothing)");
    log(soFar ? `reading back: ${soFar}` : "nothing recorded yet", "work");
    mouth?.silence();
    mouth?.speak(soFar ? `So far you have. ${soFar}` : "Nothing recorded yet.");
  }

  // The last thing you said, taken out. Dictation hands over a piece each time you
  // pause, so a piece is roughly a sentence — which is what you would want back.
  function dropLast() {
    // Nothing left to drop, but something was emptied a moment ago — so this means
    // "undo that", which is what a person means by it. A wipe that cannot be undone
    // is the only failure here that actually costs you anything.
    if (!question.length && lastEmptied.length) {
      question = lastEmptied;
      lastEmptied = [];
      trace("PUT BACK", asTidied());
      log(`put back: ${asTidied()}`, "work");
      show();
      mouth?.silence();
      sound.note("listening");
      mouth?.speak(`Put back. ${asTidied()}`);
      return;
    }

    if (!question.length) {
      mouth?.silence();
      mouth?.speak("There is nothing to take back.");
      return;
    }
    const dropped = question.pop();
    const droppedText = dropped.tidied ?? dropped.heard;
    trace("TOOK BACK", droppedText);
    log(`took back: ${droppedText}`, "work");
    show();
    mouth?.silence();
    sound.note("wiped");
    const last = question[question.length - 1];
    mouth?.speak(last ? `Taken out. It now ends. ${last.tidied ?? last.heard}` : "Taken out. Nothing left.");
  }

  function heard(spokenAloud) {
    // The word is how you get its attention, not part of what you are asking. It has
    // done its job the moment it is recognised, so it never reaches the question — the
    // same way you would not expect somebody's name to end up inside the sentence you
    // said to them.
    // Noticed before it is taken out, or taking it out would remove the very thing
    // that was about to be acted on.
    const addressed = wantsAttention(spokenAloud);
    lastHeardAt = Date.now();

    // Held off. Everything is dropped except the one instruction that brings it back,
    // which still has to be addressed like any other — so a passenger saying "carry on"
    // to somebody else cannot wake it.
    if (heldOff) {
      const backAgain = addressed &&
        readAsInstructions(spokenAloud, setup.phrases).some((step) => step.command === "resume");
      if (!backAgain) { trace("ignored (holding off)", spokenAloud); return; }
      listenAgain();
      return;
    }
    // Left in on purpose now: the part that recognises instructions needs to see it,
    // because an instruction only counts when you addressed the machine first. It is
    // taken out there instead, so it never reaches the question either way.
    const text = spokenAloud;
    if (!text && !addressed) return;
    live = "";
    // Anything you say calls off an offer that has not been made yet — this is what
    // stops a sentence you were still adding to from being asked about.
    stopOffering();

    // A one-word answer to a question it has just asked goes through before anything
    // else, echo test included. The echo test only counts words longer than three
    // letters, so "yes" and "no" leave nothing behind to compare and were being
    // thrown away as its own voice — silently, at the exact moment you were most
    // likely to say them, which is while it is still finishing the question.
    if (isBareAnswer(text)) {
      mouth?.silence();
      answerGiven(text);
      return;
    }

    // Its own voice off the windscreen is not part of your question. This is the only
    // thing standing between always-listening and it writing down its own answer.
    // An offer to send is the one thing this app says that you are expected to talk
    // straight through. It asks while you are drawing breath, so treating your next
    // words as its own echo — which is what being deaf while talking does — threw away
    // the rest of the sentence you were plainly still saying.
    if (mouth?.busy && offering && !soundsLikeItself(text, mouth.saying)) {
      trace("carried on talking through the offer", text);
      stopOffering();
      offering = false;
      mouth.silence();
    } else if (mouth?.busy) {
      // While it is talking, nothing gets in unless you addressed it. Comparing words to
      // decide what was its own voice leaked both ways — its sentences landed in the
      // question, and your short replies were eaten as echo. Nothing is left to guess:
      // sound is in the air, so almost everything arriving is that sound coming back,
      // and the one thing that certainly is not is a word this app can never say.
      if (addressed) {
        trace("stopping: heard the word", spokenAloud);
        mouth.silence();
        if (!text) return;   // nothing but the word: it has stopped, that was the point
      } else {
        trace("ignored (it was talking)", spokenAloud);
        return;
      }
    } else if (mouth?.settling && !addressed && soundsLikeItself(text, mouth.saying, { whenNothingDistinctive: false })) {
      // The sound has stopped but its last words are still on their way back. Dictation
      // runs a beat behind the audio, so the end of its own sentence used to land here
      // just after it believed it had finished — when nothing was checking at all — and
      // was written down as the question. That is the fault this whole change exists
      // for. Only its own words are refused, so a real question said the instant it
      // stops is still heard.
      //
      // Never the word, though, on the same grounds as everywhere else: the app cannot
      // say it, so a sentence carrying it cannot be the app's own voice, however much
      // of the rest matches. Addressing it has to work at every moment — while it is
      // talking, in the beat after it stops, and during anything it announces on its
      // own account — or the one thing with no threshold on it has a gap in it.
      trace("ignored (its own tail)", text);
      return;
    }

    // A question it asked gets first refusal on what you said next. This is before
    // the phrase reader on purpose: while it is waiting, "no" means no, and does not
    // want treating as the start of a sentence.
    if (answerGiven(text)) return;

    for (const step of reader.feed(text)) {
      if (step.command) { obey(step.command, step.spokenAs); continue; }

      // "work on" is also something people say inside a perfectly ordinary question —
      // "can you work on the login bug". So it only counts as changing project if
      // what follows actually names one; otherwise both halves go back where they
      // came from and it is a question like any other.
      // The noises come out here, before anything reads what was said: a project name
      // with an "um" in front of it is still the project name.
      const said = withoutFiller(step.say);
      if (!said) { trace("dropped (nothing but filler)", step.say); continue; }
      if (said !== step.say) trace("filler out", `${step.say} -> ${said}`);

      if (awaitingProject) {
        const found = projectAtTheFront(said);
        awaitingProject = null;
        if (found) {
          switchTo(found.project, found.rest);
          continue;
        }
        remember(`${awaitingProject ?? ""} ${said}`.trim());
        trace("not a project, so just words", said);
        continue;
      }

      remember(said);
      trace("keeping", said);
    }

    show();
    if (!mouth?.busy) idleState();
    maybeOfferToSend();
  }

  function fromClaude(kind, text) {
    // Housekeeping said in plain words, and said whatever else is going on. It goes
    // through the same one queue as everything else, so it lands after the answer that
    // is still being read out rather than on top of it.
    if (kind === "notice") {
      log(text, "work");
      mouth?.speak(text);
      return;
    }
    if (kind === "progress") {
      log(text, "work");
      setState(text);
      // A long silence with a tick under it tells you something is happening and
      // nothing about what. So the updates are spoken too — but sparingly, because a
      // voice narrating every step is worse than the silence it replaced. One every
      // twenty seconds or so, never on top of itself, and never the same words twice
      // running.
      sinceLastUpdate.push(text);
      sayWhereItIsUpTo();
      return;
    }
    if (kind === "final") {
      working = false;
      stopTicking();
      waitingForYou();   // the quiet after an answer is measured from the answer
      if (newPageWaiting && !toldAboutTheNewPage) {
        toldAboutTheNewPage = true;
        log("a newer page is ready — say \"load the new page\" when you can", "work");
      }
      log(text);
      sound.note("ready");
      mouth?.speak(text);
      if (endsWithAQuestion(text)) {
        trace("waiting", "the answer ended in a question");
        waitForAnswer(() => answerClaude("yes"), () => answerClaude("no"));
      } else {
        // After a long wait, the end of the answer is hard to be sure of: it stops,
        // and nothing says whether that was the end or a pause before more. So it
        // hands back in as many words, and the tone lands after the handover rather
        // than before the answer — the same note, now meaning "your turn" instead of
        // "here it comes". Not done on a quick answer, where nobody was in any doubt,
        // and not done after a question, because the question is the handover.
        //
        // Any answer that had to say what it was up to along the way counts as a long
        // one whatever the clock says: being told three times that work is going on
        // and then hearing it stop is exactly the case that needs an ending.
        //
        // Timed from the question going out to the talking stopping, which is the only
        // measure that matches what the person actually sat through. Timing the
        // thinking alone was the mistake: ten seconds of thought followed by forty
        // seconds of answer is a long wait by every measure except that one, and those
        // were exactly the answers that ended in silence.
        whenQuiet.push(() => {
          const wholeThing = Date.now() - workStartedAt;
          if (!lastSaidSoFar && wholeThing < (setup.handBackAfter ?? 15_000)) return;
          trace("handing back", `the whole thing took ${Math.round(wholeThing / 1000)}s`);
          mouth?.speak("Over to you.");
          whenQuiet.push(() => sound.note("ready"));
        });
      }
      return;
    }
    if (kind === "error") {
      working = false;
      stopTicking();
      log(text, "bad");
      mouth?.speak(text);
    }
  }

  return {
    async start() {
      if (!mouth) throw new Error("This browser has no built-in voice. Use Safari.");
      mouth.unlock();

      // Which ear. The Mac's when it is there, the phone's own when it is not — and
      // saying so in the trace, because "it did not hear me" is the same complaint
      // either way and the two have very different causes.
      // Which ear, and a way back from the new one. Trying a different ear on somebody
      // who is driving is only defensible if it cannot leave them unable to talk, so
      // the choice is made once here and undone automatically if it does not work.
      // Which ear is the one in use, so an ear that has been replaced cannot pull the
      // rug out from under the one that replaced it. That is not hypothetical: the
      // first ear gives up slowly, over several tries, and by the time it finally says
      // so a tap may already have started a better one. Its late complaint was tearing
      // that down and handing back — which looked exactly like the tap not working.
      let earsInUse = 0;
      const startEars = (onTheMac) => {
        const mine = ++earsInUse;
        trace("ear", onTheMac ? "the Mac is hearing" : "the phone is hearing");
        const made = (onTheMac ? macEars : deviceEars)(earRules(onTheMac, () => mine === earsInUse));
        if (!made && onTheMac) return startEars(false);
        return made;
      };
      const earRules = (onTheMac, stillTheOne = () => true) => ({
        // Nothing arriving from the microphone at all. Falls back to the phone's own
        // dictation, which needs no help from this Mac, and says so out loud — silence
        // that repairs itself invisibly is how you end up not trusting either.
        onDeaf: (why, worthAnotherGo) => {
          if (!onTheMac) return;
          // A complaint from an ear nobody is listening through any more.
          if (!stillTheOne()) { trace("a replaced ear reported in", why ?? ""); return; }
          try { ears?.stop(); } catch {}
          // Which of the two it was, because they have completely different cures and
          // one message for both sent somebody looking in the wrong place.
          // When a tap is going to be offered, nothing is started in the meantime.
          //
          // This is the trap the last three attempts kept falling into. Starting the
          // phone's own dictation while waiting for a tap means that when the tap comes
          // the phone is already holding its microphone, and it will not hand the same
          // one to two things. Letting go in the same breath does not help: it does not
          // let go instantly. Waiting for it to let go spends the tap. There is no
          // order of those three that works — so the answer is not to be listening at
          // all for the few seconds between the offer and the tap.
          if (worthAnotherGo) {
            log("tap the screen once and the Mac will do the hearing", "work");
          } else {
            log(`${why ?? "the Mac couldn't hear"}, so I'm listening on the phone instead`, "bad");
            ears = startEars(false);
            ears?.start();
          }

          // A phone will not hand a page the microphone unless a finger asked for it,
          // and this app deliberately starts itself without one — at seventy miles an
          // hour, needing a tap to get going again after a restart is worse than any
          // ear. Both of those are right, and together they mean the better ear can
          // never start by itself on the first load.
          //
          // So it falls back at once, which is what keeps somebody able to talk, and
          // then waits for the next touch of the screen — whatever that touch was for
          // — and quietly upgrades. Nobody has to know that is what the tap did.
          if (!worthAnotherGo) return;
          setState("tap the screen once and the Mac can do the hearing");
          const onTouch = () => {
            document.removeEventListener("click", onTouch);
            trace("a tap arrived", "asking with nothing else listening");
            // Let go of the phone's own dictation first — and in the same breath, with
            // nothing waited for in between.
            //
            // This is the last difference between this page and the one that already
            // works: that page has never had a recogniser running when it asks. This
            // one always has, because falling back to the phone's dictation is what
            // keeps somebody able to talk while all this is going wrong. A phone gives
            // its microphone to one thing at a time, and it does not say that is the
            // problem — it complains about the state of the page instead.
            //
            // Stopping is instant and asking is the next line, so the finger that
            // arrived with this click is still there when the asking happens. That is
            // the part every earlier attempt got wrong: each one waited first.
            try { ears?.stop(); } catch {}
            navigator.mediaDevices
              .getUserMedia({ audio: true })
              .then((granted) => {
                ears = startEars(true);
                ears?.start(granted);
              })
              .catch((err) => {
                trace("still no microphone", `${err?.name ?? "?"} at ${location.hostname}`);
                // Which address this page was opened by, said out loud with the
                // failure. A phone refuses the microphone outright on a page whose
                // certificate it had to warn about — and it blames something else
                // while doing it, which is how hours go into the wrong question.
                const trusted = setup.trustedName ?? "";
                const wrongDoor = trusted && location.hostname !== trusted;
                log(
                  wrongDoor
                    ? `still no microphone (${err?.name ?? "?"}) — this page was opened as ${location.hostname}. Open it as ${trusted} instead; a phone will not give a microphone to an address it had to warn you about.`
                    : `still no microphone (${err?.name ?? "no reason given"}) at ${location.hostname}`,
                  "bad",
                );
                // The phone's ear was let go of on the way in, so it has to be picked
                // back up or the failed experiment costs somebody their voice.
                ears = startEars(false);
                ears?.start();
              });
          };
          // A finished click, not the beginning of a touch. A phone counts only some
          // events as somebody actually asking for something, and the press going down
          // is not one of them — the page that already works uses a click, and this is
          // the last difference left between the two.
          document.addEventListener("click", onTouch, { once: true });
        },
        // Nothing appears on the screen while somebody talks any more, because nothing
        // exists yet — the Mac is only given whole pieces, at the pauses. A screen that
        // sits blank while you speak reads as a screen that is not listening, which is
        // the one thing it must never read as. So it says what it is doing at each of
        // the two moments it now has: sound arriving, and a piece gone off to be turned
        // into words.
        // Sound in the room is you talking, and that is now the only sign of it there
        // is. It has to do everything a half-heard word used to do: keep the clock that
        // decides you have finished pushed forward, and call off an offer to send that
        // has not been made yet.
        //
        // Without this the app believed you were silent from the moment you started
        // speaking until the moment you stopped — so it offered to send in the middle of
        // sentences, over and over, which is exactly how it felt.
        onSound: () => {
          lastHeardAt = Date.now();
          stopOffering();
          if (!working && !mouth?.busy) setState("listening…");
        },
        onWorkingOnIt: (yes) => {
          if (working || mouth?.busy) return;
          if (yes) setState("working out what you said…");
          else if (!question.length) idleState();
        },
        onHeard: heard,
        onHearing: (text) => {
          // Not shown while it is talking, because it is not being kept either. Watching
          // its own voice type itself across your screen looks exactly like the words
          // going somewhere, and they are not — they are thrown away a moment later.
          // Showing what is about to be discarded is its own kind of lie.
          //
          // The ear cannot simply be switched off instead: it has to stay open to hear
          // the one word that stops it. So it listens and says nothing.
          if (heldOff) return;   // held off means shown nothing, not just kept nothing
          if (mouth?.busy && !wantsAttention(text)) return;
          live = text;
          lastHeardAt = Date.now();   // half-heard words are still you, still talking
          stopOffering();
          show();
        },
        // Talking over it has to stop it straight away rather than at the end of
        // your sentence, so this acts on words it has not finished hearing.
        onPartialPhrase: (text) => {
          // Acting on words it has not finished hearing is how it cut its own answer
          // off. Its own voice arrives garbled, so a fragment of its own sentence looks
          // like somebody new talking. The word is the only thing worth acting on early.
          if (mouth?.busy && wantsAttention(text)) {
            trace("stopping: heard the word", text);
            mouth.silence();
          }
        },
        onTrouble: (message) => log(message, "bad"),
      });

      ears = startEars(Boolean(setup.earOnTheMac));
      if (!ears) throw new Error("This browser has no built-in dictation. Use Safari on the phone.");

      questionInProgress = () => asTidied();
      listenForResults(fromClaude);
      ears.start();
      goBtn.disabled = false;

      // Whatever was being said when the page was replaced under it.
      try {
        const kept = sessionStorage.getItem(KEPT);
        if (kept) {
          sessionStorage.removeItem(KEPT);
          question = [{ heard: kept, tidied: kept }];
          log(`carried over: ${kept}`, "work");
        }
      } catch {}
      show();
      idleState();
      const firstWording = (name) => [setup.phrases?.[name]].flat()[0];
      log(
        `ready — talk. Say "${firstWording("send")}" to send, ` +
        `"${firstWording("read")}" to hear it back, ` +
        `"${firstWording("wipe")}" to start again.`,
        "work",
      );
      trace("session started");
    },
    stop() {
      ears?.stop(); ears = null;
      mouth?.silence();
      results?.close(); results = null;
      stopWork();
      stopTicking();
      stopWaitingNote();
      working = false;
      question = [];
      live = "";
      promptEl.textContent = "";
    },
    // The same thing the closing phrase does, for when the road is too loud to be
    // heard over. Never needed, always there.
    tap() {
      // A browser that refused to make sound to a page nobody had touched will hand
      // it over the moment somebody does. So the first tap after a refusal buys the
      // voice back rather than sending, which is the only thing it could be for.
      if (sound.refused) {
        sound.wake();
        soundCameBackAt = Date.now();
        trace("tapped: asking for sound again");
        setState("listening — talk whenever you like");
        // Said out loud on purpose. Getting the voice back is silent, so it looks
        // exactly like the tap having done nothing — which is what makes somebody tap
        // again, and the second tap used to mean shut up.
        mouth?.speak("Sound's back.");
        return;
      }
      // A tap arriving right after the one that bought the voice back is somebody
      // asking "did that work?", not somebody asking for silence. Reading it as
      // silence is what made the recovery look like a failure and cost a whole
      // evening: tap, nothing, tap again, and now it is mute for a reason nobody in
      // the car can see.
      if (Date.now() - soundCameBackAt < (setup.tapAgainWithin ?? 4_000)) {
        trace("tapped: still checking the sound came back");
        return;
      }
      if (mouth?.busy) { mouth.silence(); trace("tapped: quiet"); return; }
      trace("tapped: send");
      send();
    },
    // Something the app says on its own account, with nobody having asked. Kept apart
    // from answers so anything that needs to speak up for itself has a way to.
    say(text) {
      trace("announcing", text);
      log(text, "work");
      // Not attempted before the phone has been touched. A phone never lets a page make
      // sound until somebody taps it, so this always failed on a fresh load — and the
      // failure printed a message about the phone refusing to play, which reads like
      // something being broken and sent us hunting a certificate that was fine.
      // Nothing is wrong here; the tap simply has not happened yet, so say that instead.
      if (sound.refused) {
        setState("tap once to give it a voice");
        return;
      }
      mouth?.speak(text);
    },
  };
}

// ------------------------------------------------------- the paid front end
//
// The original: one model does the hearing and the speaking inside a single billed
// audio stream. Kept because natural interruption is genuinely better — it is simply
// not worth its price for most drives.

function realtimeFrontEnd() {
  let pc = null, dc = null, live = false;
  let micStream = null, reconnectTimer = null, attempt = 0, instructionsCache = null;
  let lastSpokeAt = 0;
  const PROGRESS_MIN_GAP_MS = 25_000;

  // Every time you speak, the whole conversation so far is billed again, so a long
  // drive gets steadily more expensive. The voice model is only a mouthpiece —
  // everything that matters is remembered by Claude on the Mac — so we throw away
  // its older turns and keep the cost flat. Nothing real is lost.
  const KEEP_TURNS = 10;
  const itemIds = [];

  function sendEvent(obj) {
    if (dc && dc.readyState === "open") dc.send(JSON.stringify(obj));
  }

  function trimConversation() {
    while (itemIds.length > KEEP_TURNS) {
      sendEvent({ type: "conversation.item.delete", item_id: itemIds.shift() });
    }
  }

  function speakThrough(note) {
    sendEvent({
      type: "conversation.item.create",
      item: { type: "message", role: "user", content: [{ type: "input_text", text: note }] },
    });
    sendEvent({ type: "response.create" });
    lastSpokeAt = Date.now();
  }

  const TOOLS = [
    {
      type: "function",
      name: "ask_claude",
      description:
        "Hand a request to Claude, which reads and reasons about the user's real code on their machine. " +
        "Use this for ANY question or instruction about their code, project, tests, commits, or tools — " +
        "you have no knowledge of these yourself. Returns immediately; the answer arrives later and you " +
        "will be told to speak it.",
      parameters: {
        type: "object",
        properties: {
          request: {
            type: "string",
            description:
              "What the user wants, in full, as an instruction to a capable engineer. Include anything " +
              "from earlier in the conversation that is needed to make sense of it on its own.",
          },
        },
        required: ["request"],
      },
    },
    {
      type: "function",
      name: "stop_claude",
      description: "Stop whatever Claude is currently doing. Use when the user says stop.",
      parameters: { type: "object", properties: {} },
    },
  ];

  async function configureSession() {
    instructionsCache ??= await (await fetch("/instructions")).text();
    sendEvent({
      type: "session.update",
      session: { type: "realtime", instructions: instructionsCache, tools: TOOLS, tool_choice: "auto" },
    });
  }

  function answerTool(callId, output) {
    sendEvent({
      type: "conversation.item.create",
      item: { type: "function_call_output", call_id: callId, output },
    });
    sendEvent({ type: "response.create" });
    lastSpokeAt = Date.now();
  }

  async function onVoiceEvent(event) {
    switch (event.type) {
      case "response.function_call_arguments.done": {
        const args = JSON.parse(event.arguments || "{}");
        if (event.name === "ask_claude") {
          log(`you: ${args.request}`, "you");
          await ask(args.request);
          answerTool(event.call_id, "Started. Say one short sentence to acknowledge, then wait quietly.");
        } else if (event.name === "stop_claude") {
          await stopWork();
          log("stopped", "work");
          answerTool(event.call_id, "Stopped.");
        }
        break;
      }
      case "conversation.item.created":
      case "conversation.item.added":
        if (event.item?.id) itemIds.push(event.item.id);
        break;
      case "response.done":
        lastSpokeAt = Date.now();
        trimConversation(); // only between turns, never mid-sentence
        break;
      case "error":
        log(`voice error: ${JSON.stringify(event.error ?? event)}`, "bad");
        break;
    }
  }

  function fromClaude(kind, text) {
    if (kind === "notice") {
      log(text, "work");
      speakThrough(`[Housekeeping, not from the user and not an answer: ${text} Say that briefly in your own words, then wait.]`);
      return;
    }
    if (kind === "progress") {
      log(text, "work");
      // Only interrupt with progress if it's been quiet for a while.
      if (Date.now() - lastSpokeAt > PROGRESS_MIN_GAP_MS) {
        speakThrough(`[Status update, not from the user: Claude is ${text}. Say this briefly and naturally, then wait.]`);
      }
      return;
    }
    if (kind === "final") {
      log(text);
      speakThrough(
        `[Claude has finished and this is its answer. Speak it to the user following your speaking rules — ` +
        `plain words, no code, lead with the outcome, findings one at a time. Do not read it verbatim.\n\n${text}]`
      );
      return;
    }
    if (kind === "error") {
      log(text, "bad");
      speakThrough(`[Something went wrong: ${text}. Tell the user in one plain sentence and ask what they want to do.]`);
    }
  }

  // A dropped connection is the most likely way a real drive falls apart — a tunnel,
  // a cell handoff, a dead spot. Nothing here should ever require taking the phone
  // out of a pocket, so we simply keep trying until we're back.
  async function connect({ resume }) {
    setState(resume ? "reconnecting…" : "connecting…");

    const url = resume ? "/token?resume=1" : "/token";
    const { secret, error } = await (await fetch(url, { method: "POST" })).json();
    if (!secret) throw new Error(error ?? "no voice credential");

    // Ask for the microphone once and keep it. Asking again on every reconnect
    // would prompt the user, which is exactly what we can't do at 70mph.
    micStream ??= await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });

    pc = new RTCPeerConnection();

    const speaker = new Audio();
    speaker.autoplay = true;
    pc.ontrack = (e) => { speaker.srcObject = e.streams[0]; };
    pc.addTrack(micStream.getTracks()[0], micStream);

    pc.onconnectionstatechange = () => {
      if (!live) return;
      if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
        log(`connection ${pc.connectionState}`, "bad");
        scheduleReconnect();
      }
    };

    dc = pc.createDataChannel("oai-events");
    dc.onopen = async () => {
      itemIds.length = 0; // a new voice session — old turn identifiers are stale
      await configureSession();
      attempt = 0;
      live = true;
      setState("listening — just talk");
      goBtn.textContent = "Stop";
      goBtn.className = "live";
      goBtn.disabled = false;
      log(resume ? "reconnected" : "connected — this mode is billed per minute", "work");

      if (resume) {
        speakThrough(
          "[You just reconnected after the network dropped. Claude's work and your " +
          "conversation with the user are both intact. Say briefly that you're back, then wait.]"
        );
      }
    };
    dc.onmessage = (m) => onVoiceEvent(JSON.parse(m.data)).catch(console.error);

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const answer = await fetch("https://api.openai.com/v1/realtime/calls", {
      method: "POST",
      headers: { authorization: `Bearer ${secret}`, "content-type": "application/sdp" },
      body: offer.sdp,
    });
    if (!answer.ok) throw new Error(`voice service refused: ${answer.status} ${await answer.text()}`);

    await pc.setRemoteDescription({ type: "answer", sdp: await answer.text() });

    if (!results) listenForResults(fromClaude);
  }

  function scheduleReconnect() {
    if (!live || reconnectTimer) return;

    try { pc?.close(); } catch {}
    pc = null; dc = null;

    const wait = Math.min(1000 * 2 ** attempt, 10_000);
    attempt += 1;
    setState(`connection lost — retrying in ${Math.round(wait / 1000)}s`);

    reconnectTimer = setTimeout(async () => {
      reconnectTimer = null;
      if (!live) return;
      try {
        await connect({ resume: true });
      } catch (err) {
        log(String(err.message ?? err), "bad");
        scheduleReconnect();
      }
    }, wait);
  }

  return {
    async start() {
      live = true; // set before connecting so a drop mid-handshake still retries
      attempt = 0;
      try {
        await connect({ resume: false });
      } catch (err) {
        log(String(err.message ?? err), "bad");
        scheduleReconnect();
      }
    },
    stop() {
      live = false;
      clearTimeout(reconnectTimer); reconnectTimer = null;
      try { pc?.close(); } catch {}
      pc = null; dc = null;
      results?.close(); results = null;
      micStream?.getTracks().forEach((t) => t.stop());
      micStream = null;
      stopWork();
    },
    // This mode hears you continuously and has no gate, so the button has nothing to
    // toggle. It is still the fastest way to shut it up.
    tap: () => speakThrough("[The user pressed quiet. Stop talking and wait.]"),
    say: (text) => {
      trace("announcing", text);
      log(text, "work");
      speakThrough(`[Status update, not from the user: say exactly this, then wait: ${text}]`);
    },
  };
}

// ------------------------------------------------------------------- the button

const frontEnd = setup.mode === "realtime" ? realtimeFrontEnd() : splitFrontEnd();
let running = false;

// The screen locking mid-drive would end the session, so ask the phone to keep it on
// while this page is in front. It is a request, not a guarantee.
let wakeLock = null;
async function holdScreenAwake() {
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (running && document.visibilityState === "visible") holdScreenAwake();
});

let carriedOver = "";
let cameBackFromARestart = false;
try {
  carriedOver = sessionStorage.getItem(KEPT) ?? "";
  cameBackFromARestart = sessionStorage.getItem(RESTARTED) === "1";
  sessionStorage.removeItem(RESTARTED);
} catch {}

// Whatever was being said when the ground moved is still on the screen while the
// session gets itself going again.
if (carriedOver) promptEl.textContent = carriedOver;

setState(
  setup.mode === "realtime"
    ? `ready — paid voice, working on ${setup.project}`
    : `ready — free voice, working on ${setup.project}`
);

function backToStopped() {
  running = false;
  wakeLock?.release?.(); wakeLock = null;
  setState("not connected");
  goBtn.textContent = "Start talking";
  goBtn.className = "";
  goBtn.disabled = false;
  endBtn.hidden = true;
  heardEl.textContent = "";
  heardEl.className = "";
}

async function begin({ announce = "" } = {}) {
  if (running) return;
  running = true;
  goBtn.disabled = true;
  holdScreenAwake();
  try {
    await frontEnd.start();
    endBtn.hidden = false;
  } catch (err) {
    log(String(err.message ?? err), "bad");
    backToStopped();
    return;
  }
  if (announce) frontEnd.say?.(announce);
  // Starting itself works wherever the browser already trusts this page, which after
  // the first drive is everywhere. Where it does not, the refusal is only ever about
  // making sound — it is still listening — so it asks for the one thing that fixes
  // it, rather than pretending to be talking into a phone that is muting it.
  setTimeout(() => {
    if (!running || !sound.refused) return;
    setState("it is listening — tap once to give it its voice back");
    goBtn.textContent = "Tap for the voice";
    goBtn.className = "";
  }, 800);
}

// While it is running the big button is the gate, not a hang-up. Ending the session
// is the rare thing, so it gets the small link and cannot be hit by accident.
goBtn.onclick = () => (running ? frontEnd.tap() : begin({ announce: whatItSaysOnStarting() }));

// Coming up silent is indistinguishable from being broken, so every way of starting
// says the same three things out loud: that it is here, which project it is working
// in, and — when the start was a restart rather than somebody arriving — that it has
// just come back. Naming the project matters most on a fresh start, because that is
// exactly the moment nobody has said yet where the work is going to land.
//
// This is written once and used by every route into a session, so a new way of
// starting cannot quietly be a silent one.
function whatItSaysOnStarting() {
  // Deliberately nameless. Saying "Voice Claude, ready and working on the advisor
  // app" put the name of one project next to the name of another in a single breath,
  // and the first one heard is the one that sticks — so it announced itself as being
  // on the voice app while working on the advisor app. The only name worth saying
  // here is the project's, because that is the one that decides where the work lands.
  const here = `Ready, working on ${setup.project}.`;
  if (!cameBackFromARestart) return here;
  cameBackFromARestart = false;   // a later start is a start, not another restart
  return carriedOver
    ? `Application restarted. ${here} What you were saying is still here.`
    : `Application restarted. ${here}`;
}

// Nothing here should need a tap at seventy miles an hour, and that includes getting
// going again after the app has restarted underneath you. So it starts itself and
// says so — because from the driver's seat a silent restart and a broken app are the
// same thing.
//
// A tap is only ever asked for when the browser actually refuses to make sound, and
// that refusal is noticed a moment after starting rather than assumed in advance.
//
// One thing is still left behind a tap: a paid session costs money by the minute and
// must never begin because a page happened to load.
if (setup.mode !== "realtime") {
  begin({ announce: whatItSaysOnStarting() });
}

endBtn.onclick = () => {
  frontEnd.stop();
  backToStopped();
};
</script>
</body>
</html>
