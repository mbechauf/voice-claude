<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>voice-claude</title>
<style>
  :root { color-scheme: dark; }
  /* Fixed to the height of the screen, and box-sized so the safe-area padding is
     counted inside it. The page itself must never scroll: if it does, the transcript
     grows past the bottom of the screen and pinning it to the newest line silently
     stops working. Exactly one thing scrolls here, and it is the transcript. */
  body {
    margin: 0; height: 100dvh; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column;
    background: #14140f; color: #f0ece2;
    font: 16px/1.5 ui-sans-serif, -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
  }
  header { padding: 1.25rem 0 0.5rem; }
  h1 { font-size: 1.1rem; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  #version { color: #6b675e; font-weight: 400; font-size: 0.8rem; }
  #state { color: #9b968a; font-size: 0.9rem; margin-top: 0.25rem; }
  button {
    font: inherit; font-size: 1.35rem; font-weight: 600;
    padding: 1.6rem; border-radius: 1rem; border: 0; width: 100%;
    background: #c96442; color: #fff; margin: 0.75rem 0;
    -webkit-tap-highlight-color: transparent;
  }
  button.live { background: #3a3a32; }
  button:disabled { opacity: 0.5; }
  /* Open: it is taking down what you say. Visible at a glance, no reading needed. */
  button.open { background: #3f6b4a; }
  /* While it is talking the whole button becomes a way to shut it up, because that
     is the one thing you want within reach without aiming. */
  button.talking { background: #5a4030; }
  /* The question being built, in full, always. Nothing in here ever disappears on
     its own — it goes when you send it, and not before. */
  #prompt {
    min-height: 5.5rem; max-height: 40dvh; overflow-y: auto;
    font-size: 1.15rem; line-height: 1.45; color: #f0ece2;
    background: #1c1c16; border: 1px solid #2e2e26; border-radius: 0.75rem;
    padding: 0.75rem; margin: 0.25rem 0;
  }
  #prompt:empty::before { content: "nothing yet — just talk"; color: #6b675e; }
  #prompt .live { color: #9b968a; }
  #end {
    background: none; border: 0; color: #6b675e; font-size: 0.85rem;
    width: auto; padding: 0.5rem 0; margin: 0; text-decoration: underline;
  }
  #log {
    flex: 1; overflow-y: auto; font-size: 0.9rem;
    border-top: 1px solid #2e2e26; padding-top: 0.75rem; margin-top: 0.25rem;
  }
  .line { padding: 0.3rem 0; border-bottom: 1px solid #23231d; }
  .you { color: #8fc7a8; }
  .work { color: #9b968a; font-style: italic; }
  .bad { color: #e08a6a; }
  /* Held off. Deliberately unlike every other state — dimmed and still, so a glance
     tells you it is ignoring you on purpose rather than having quietly died. */
  button.paused { background: #2a2d33; color: #8b9098; border-color: #3a3f47; }
</style>
</head>
<body>
<header>
  <h1>voice-claude <span id="version">__VERSION__</span></h1>
  <div id="state">not connected</div>
</header>

<div id="prompt"></div>

<button id="go">Start talking</button>
<button id="end" hidden>end session</button>
<div id="log"></div>

<script type="module">
const stateEl = document.getElementById("state");
const promptEl = document.getElementById("prompt");
const logEl = document.getElementById("log");
const goBtn = document.getElementById("go");
const endBtn = document.getElementById("end");

const setup = await (await fetch("/setup")).json();


function setState(text) { stateEl.textContent = text; }

function log(text, cls = "") {
  const div = document.createElement("div");
  div.className = `line ${cls}`;
  div.textContent = text;
  logEl.append(div);
  scrollToNewest();
  return div;
}

// Always show the newest line. Setting this straight after appending is right most
// of the time, but a long answer can still be laying itself out when we ask, so we
// ask again once the browser has finished drawing.
function scrollToNewest() {
  logEl.scrollTop = logEl.scrollHeight;
  requestAnimationFrame(() => { logEl.scrollTop = logEl.scrollHeight; });
}

// ---------------------------------------------------------------------- the Mac
//
// Everything below this line is the same whichever voice layer is in use: work goes
// to the Mac, and answers come back from it on their own.

let results = null;
let lastAnswer = "";
let yourLastLine = null;   // the line showing what you just sent, so it can be repaired in place
let wasRestarting = false;

function ask(request, { alreadyTidied = false } = {}) {
  return fetch("/ask", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ request, alreadyTidied }),
  });
}

// Say what is happening back to the Mac. Nothing here waits for an answer, and a
// failed note is never worth a word to the driver.
function trace(what, detail = "") {
  fetch("/trace", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ what, detail: String(detail).slice(0, 200) }),
  }).catch(() => {});
}

const myVersion = document.getElementById("version").textContent;
trace("page loaded", myVersion);

// The other half of this system runs here, in the browser, and restarting the Mac
// does nothing for it. So the Mac says which page it now has, and this one notices
// when it is out of date.
//
// Reloading is not free: an iPhone only lets a page make sound through a channel
// opened by a tap, and a reload closes it. So a page that is idle reloads at once,
// and a page mid-drive says so and waits — being silently struck dumb at seventy
// miles an hour is far worse than running yesterday's code for another minute.
let newPageWaiting = false;

// The question in progress is kept across the reload, because losing two minutes of
// assembled words to a version bump would be its own small betrayal.
const KEPT = "voice-claude-question";

// Set when the app reloads itself, so the page that comes back knows it is a restart
// rather than somebody opening the page. A restart is the one reload where silence is
// unacceptable: the driver asked for something, everything went quiet, and nothing
// told them it was back. So the new page starts itself and says so out loud.
const RESTARTED = "voice-claude-restarted";

async function checkForANewPage({ reloadIfIdle }) {
  try {
    const now = await (await fetch("/setup")).json();
    if (!now.page || now.page === myVersion) return false;

    trace("NEW PAGE WAITING", `${myVersion} -> ${now.page}`);
    newPageWaiting = true;
    if (reloadIfIdle) loadTheNewPage();
    return true;
  } catch {
    return false;   // the Mac is still coming back up; ask again next time
  }
}

// The Mac is about to come back with new code, and half of this system is here in
// the browser. Staying on the old page after that is the confusing state: the two
// halves disagree, and nothing says so. So it waits for the Mac and then loads
// itself again — which is also the only way the browser picks up new code at all.
//
// The cost is real and unavoidable: an iPhone only lets a page make sound through a
// channel opened by a tap, and a reload closes it. So it comes back saying, in large
// letters, that one tap brings the voice back — and carrying whatever question was
// being built when the ground moved.
async function comeBackFresh() {
  const keep = questionInProgress();
  for (let tries = 0; tries < 40; tries += 1) {
    await new Promise((resume) => setTimeout(resume, 500));
    try {
      const answer = await fetch("/setup", { cache: "no-store" });
      if (!answer.ok) continue;
      trace("THE MAC IS BACK — RELOADING");
      loadTheNewPage(keep);
      return;
    } catch {
      // still down; that is what we are waiting for
    }
  }
  setState("the Mac has not come back — tap to try again");
}

// Set by the front end, so the reload can carry the question across without this
// having to know how the front end keeps it.
let questionInProgress = () => "";

function loadTheNewPage(keep = "") {
  try {
    if (keep) sessionStorage.setItem(KEPT, keep);
    sessionStorage.setItem(RESTARTED, "1");
  } catch {}
  trace("LOADING THE NEW PAGE");
  location.reload();
}

const stopWork = () => fetch("/stop", { method: "POST" }).catch(() => {});
const forgetDrive = () => fetch("/new", { method: "POST" }).catch(() => {});

// `handle` is given ("progress" | "final" | "error", text) as Claude works.
function listenForResults(handle) {
  results = new EventSource("/events");
  results.onmessage = (message) => {
    const { kind, text, how } = JSON.parse(message.data);

    // A question typed at a screen is not this page's business. Talking and typing
    // are two modes rather than a mixture: somebody typing is looking at a screen,
    // and a voice starting up at whoever else is in the room — or worse, at a driver
    // who did not ask anything — is simply wrong. It is told about it and stays
    // quiet, rather than being kept in the dark, so there is still one conversation.
    if (how === "typed") return;

    if (kind === "final") lastAnswer = text;

    // The Mac has repaired the sentence that was just sent. You never saw that
    // happen — the screen still shows the raw dictation — so put the tidied words
    // in its place. It is the same line, not a new one: seeing your question twice
    // would be worse than not seeing the repair at all.
    if (kind === "tidied") {
      trace("TIDIED", text);
      if (yourLastLine) yourLastLine.textContent = `you: ${text}`;
      return;
    }

    // It is about to disappear for a second and come back with new code. Say so,
    // because otherwise this looks exactly like the thing breaking.
    if (kind === "restarting") {
      trace("SERVER RESTARTING", text);
      log(`the app is restarting — ${text}`, "work");
      setState("restarting…");
      wasRestarting = true;
      comeBackFresh();
      return;
    }

    handle(kind, text);
  };
  results.onerror = () => setState("lost the link to the Mac — retrying");
  results.addEventListener?.("open", () => {
    trace("link to the Mac is back");
    // It has just come back, which usually means it restarted, which usually means
    // something changed — possibly this page.
    checkForANewPage({ reloadIfIdle: !running });
  });
}

// -------------------------------------------------------------- the phone's ears
//
// The phone's own dictation. Free, and the audio never leaves it — only the words
// come back. It stops listening on its own after a pause, so we start it again;
// nothing here may ever need a tap at seventy miles an hour.

/**
 * The Mac's ear: the phone stops recognising and starts sending sound.
 *
 * Same shape as the phone's own ear next door, on purpose — start it, stop it, and it
 * calls back with what was heard. Nothing else in this page knows which one is in use,
 * which is what makes swapping them a choice rather than surgery.
 *
 * Three things are genuinely different, and they are the whole of what to understand:
 *
 *   THIS PAGE OWNS THE CLOCK. The phone's dictation decided for itself when a piece of
 *   speech ended. Here, loudness is measured against the room's own quiet — which is
 *   itself measured continuously while nobody is speaking, so a car and a study both
 *   work with no setting anywhere — and a pause ends the piece.
 *
 *   THERE ARE NO HALF-HEARD WORDS. Nothing exists until the pause, so there is nothing
 *   to show on the screen as you speak and nothing to act on early. What that costs is
 *   said where it is paid, below.
 *
 *   PLAIN SOUND, CONVERTED HERE. Every browser compresses differently and the Mac has
 *   no audio tooling to undo that, so what goes over is uncompressed samples at the
 *   rate the ear expects.
 *
 * Taken from the advisor's speech branch, where it was built and driven with, rather
 * than written again from the description of it.
 */
function macEars({ onHeard, onHearing, onPartialPhrase, onTrouble, onSound, onDeaf, onWorkingOnIt }) {
  if (!navigator.mediaDevices?.getUserMedia) return null;

  const WANT_RATE = 16000;          // what the ear expects, and all it accepts
  // The pause that ends a piece. It looks like a knob for how fast words appear, and it
  // is really a knob for how well they are heard — which is the whole reason for
  // hearing on the Mac at all.
  //
  // Every break becomes a cut, and each piece is turned into words on its own, knowing
  // nothing of the one before it. Cut at every hesitation and the ear is given
  // fragments instead of sentences, and it does what anybody would do with a fragment:
  // guesses. Five tenths of a second was tried and it chopped ordinary speech into
  // pieces mid-thought. So it sits well past a thinking pause, and the cost — a beat
  // longer before anything appears — is paid in the one place there is something to
  // show for it.
  const QUIET_ENDS_A_PIECE_MS = 900;
  const MIN_PIECE_MS = 300;          // shorter than this is a door, a cough, a knock

  let ctx = null, stream = null, source = null, node = null;
  let wanted = false, speaking = false, piece = [], sinceQuiet = 0;
  let floor = 0.01;                  // the room's own quiet, learned continuously
  const waiting = [];
  let busy = false;
  let anySoundAtAll = false;         // has the microphone ever actually delivered anything

  function heardIt(ev) {
    anySoundAtAll = true;
    const data = ev.inputBuffer.getChannelData(0);
    let sum = 0;
    for (let i = 0; i < data.length; i += 1) sum += data[i] * data[i];
    const loudness = Math.sqrt(sum / data.length);
    const rate = ctx.sampleRate;
    const chunkMs = (data.length / rate) * 1000;

    // Learned only while nobody is speaking, or it would slowly decide that your voice
    // is what silence sounds like.
    if (!speaking) floor = floor * 0.995 + loudness * 0.005;
    const loud = loudness > Math.max(floor * 3.5, 0.006);

    if (loud) {
      if (!speaking) { speaking = true; piece = []; }
      // Every moment there is a voice, not only the first. The rest of the app used to
      // learn "somebody is still talking" from half-heard words arriving continuously,
      // and those do not exist any more — so this is now the only thing that knows, and
      // it has to say so all the way through rather than once at the start.
      onSound?.();
      sinceQuiet = 0;
      piece.push(new Float32Array(data));
      return;
    }

    if (!speaking) return;
    sinceQuiet += chunkMs;
    // The quiet part is kept too: words trail off, and cutting at the moment it stops
    // being loud clips the end of the last one.
    piece.push(new Float32Array(data));
    if (sinceQuiet < QUIET_ENDS_A_PIECE_MS) return;

    speaking = false;
    const spokenMs = ((piece.length * data.length) / rate) * 1000 - sinceQuiet;
    if (spokenMs >= MIN_PIECE_MS) {
      let total = 0;
      for (const part of piece) total += part.length;
      const all = new Float32Array(total);
      let at = 0;
      for (const part of piece) { all.set(part, at); at += part.length; }
      send(all, rate);
    }
    piece = [];
  }

  /** Plain 16-bit samples at the rate the ear wants, made here rather than there. */
  function asPlainSound(samples, fromRate) {
    const ratio = fromRate / WANT_RATE;
    const length = Math.floor(samples.length / ratio);
    const out = new DataView(new ArrayBuffer(length * 2));
    for (let i = 0; i < length; i += 1) {
      const at = i * ratio;
      const lo = Math.floor(at);
      const hi = Math.min(lo + 1, samples.length - 1);
      let v = samples[lo] + (samples[hi] - samples[lo]) * (at - lo);
      v = Math.max(-1, Math.min(1, v));
      out.setInt16(i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
    }
    return out.buffer;
  }

  // Strictly in the order they were spoken, one at a time. Two at once and a short
  // piece overtakes a long one, which puts your words back in the wrong order — and
  // nothing downstream could ever tell that had happened.
  function send(samples, rate) {
    waiting.push({ samples, rate });
    if (!busy) drain();
  }

  async function drain() {
    busy = true;
    while (waiting.length) {
      const job = waiting.shift();
      onWorkingOnIt?.(true);
      try {
        const answer = await fetch("/heard", {
          method: "POST",
          headers: { "content-type": "application/octet-stream" },
          body: asPlainSound(job.samples, job.rate),
        });
        const got = answer.ok ? await answer.json() : null;
        const text = String(got?.text ?? "").trim();
        if (text) {
          trace("heard (from the Mac)", text);
          // The whole piece at once. What the phone called half-heard words does not
          // exist here, so the two callbacks that fed on those are given the finished
          // words instead: the screen catches up in one go, and anything that acts on
          // the attention word acts now rather than sooner.
          onHearing?.(text);
          onPartialPhrase?.(text);
          onHeard(text);
        }
      } catch (err) {
        trace("the Mac could not hear that", err?.message ?? err);
      }
      onWorkingOnIt?.(false);
    }
    busy = false;
  }

  /**
   * Ask the phone for the microphone, and do not take a fumble for a no.
   *
   * There are two completely different refusals and they were being treated the same.
   * "You said no" is final and arguing with it is rude. But a phone also refuses when
   * the page is not in a state where it is allowed to ask at all — being hidden, or
   * still settling after a reload, or in the middle of being replaced. That is not a
   * decision, it is a moment, and the cure for a moment is to wait and ask again.
   *
   * So a flat no is taken as a no, and anything else is retried a few times, after
   * waiting for the page to actually be in front of somebody. A page that cannot ask
   * because nobody is looking at it will be able to the second they are.
   */
  async function askForTheMicrophone(tries = 4) {
    // Asked for plainly. The page that works asks for "a microphone" and nothing else,
    // and this one was asking for one channel with echo cancellation and noise
    // suppression — a shopping list, on a device that may have nothing matching it.
    // The refinements are asked for afterwards, on the microphone we were given, where
    // being turned down costs nothing at all.
    const wants = { audio: true };
    let last = null;
    for (let go = 0; go < tries; go += 1) {
      if (!wanted) throw new Error("no longer listening");
      // Never before the first attempt. Waiting for anything at all — a page to become
      // visible, a moment to pass, another ear to let go — spends the very thing being
      // asked with: a phone hands over a microphone in answer to a finger, in that
      // instant, and anything that happens first has already lost it. Both of the
      // careful waits added here did exactly that, and each looked like a new fault.
      if (go > 0 && document.visibilityState !== "visible") {
        trace("waiting for the page to be in front", `try ${go + 1}`);
        await new Promise((done) => {
          const seen = () => { document.removeEventListener("visibilitychange", seen); done(); };
          document.addEventListener("visibilitychange", seen);
          setTimeout(seen, 5_000);
        });
      }
      try {
        return await navigator.mediaDevices.getUserMedia(wants);
      } catch (err) {
        last = err;
        // A person saying no is not a fumble, and asking again is how a permission
        // prompt turns into pestering.
        if (err?.name === "NotAllowedError" || err?.name === "SecurityError") throw err;
        trace("the microphone was not ready", `${err?.name ?? "?"} — trying again`);
        await new Promise((r) => setTimeout(r, 400 * (go + 1)));
      }
    }
    throw last ?? new Error("no microphone");
  }

  return {
    async start(alreadyGranted = null) {
      wanted = true;
      try {
        // A microphone somebody already handed us is used as it is. That is the whole
        // difference between working and not: a phone gives one out in answer to a
        // finger, in that instant and no later, so the asking has to happen in the
        // touch itself and everything else has to happen afterwards.
        //
        // Echo cancellation matters more here than it ever did: this ear will happily
        // write down the Mac's own voice coming back off the windscreen, because it has
        // no idea any of the sound is its own.
        stream = alreadyGranted ?? await askForTheMicrophone();
        // Now that we have it, ask it to behave. Echo cancellation matters more here
        // than it ever did — this ear will happily write down the Mac's own voice
        // coming back off the windscreen, because it has no idea any of the sound is
        // its own. But it is a preference, not a condition: a microphone that will not
        // do it is still a microphone, and refusing one on those grounds is how you end
        // up with no ear at all.
        try {
          await stream.getAudioTracks()[0]?.applyConstraints({
            echoCancellation: true,
            noiseSuppression: true,
            channelCount: 1,
          });
        } catch (err) {
          trace("the microphone would not take the refinements", err?.name ?? "?");
        }
      } catch (err) {
        // Refused. This is not a fault to report and stop at — it is the commonest way
        // the new ear fails, and it leaves somebody driving with no way to talk at all.
        //
        // It is usually not about permission either. Safari will not hand the
        // microphone to a page whose certificate it warned about, however many times
        // the warning was accepted, so opening the app by its address rather than by
        // its full name refuses the microphone and says nothing about certificates.
        // The phone's own dictation is unaffected by any of that, which is exactly why
        // it is the thing to fall back to.
        // The browser's own word for what went wrong, said out loud rather than
        // swallowed. There are at least four completely different reasons a phone
        // refuses — the person said no, the page is not trusted, something else has
        // the microphone, or this kind of page is not allowed one at all — and they
        // have four different cures. Guessing between them from the driver's seat cost
        // an hour; the browser knew the answer the whole time and was never asked.
        const named = err?.name ? ` (${err.name})` : "";
        trace("the microphone was refused", `${err?.name ?? "no reason given"}: ${err?.message ?? ""}`);
        // A flat no is final and there is nothing a tap will do about it. Anything else
        // is worth trying again the moment a finger touches the screen, because a
        // finger is the one thing a phone insists on before it will hand over a
        // microphone, and this app starts itself without one on purpose.
        const finalNo = err?.name === "NotAllowedError" || err?.name === "SecurityError";
        onDeaf?.(
          finalNo
            ? `the phone wouldn't give this page the microphone${named}`
            : `the Mac's ear needs a tap first${named}`,
          !finalNo,
        );
        return;
      }
      if (!wanted) { stream.getTracks().forEach((t) => t.stop()); return; }
      ctx = new (window.AudioContext ?? window.webkitAudioContext)();
      // A phone starts this asleep unless a finger woke it, and asleep it delivers no
      // sound at all — silently, with everything looking connected. Asking it to wake
      // costs nothing when it was already awake.
      try { if (ctx.state === "suspended") await ctx.resume(); } catch {}
      source = ctx.createMediaStreamSource(stream);
      node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = heardIt;
      source.connect(node);
      node.connect(ctx.destination);
      speaking = false;
      piece = [];
      trace("listening", "the Mac is doing the hearing");

      // An ear that never hears anything is not an ear, and from the driver's seat it
      // is indistinguishable from the app being broken — which is exactly what it was.
      // So it is given a few seconds to deliver any sound at all, and if none arrives
      // it hands back to the one that was working before rather than leaving somebody
      // talking to a page that cannot hear. This is the only honest way to try a new
      // ear on somebody who is driving.
      setTimeout(() => {
        if (!wanted || anySoundAtAll) return;
        trace("the Mac's ear delivered nothing", "handing back to the phone");
        onDeaf?.("the Mac heard nothing at all");
      }, 5_000);
    },
    stop() {
      wanted = false;
      speaking = false;
      piece = [];
      try { node?.disconnect(); source?.disconnect(); } catch {}
      try { ctx?.close(); } catch {}
      if (stream) stream.getTracks().forEach((t) => t.stop());
      ctx = null; stream = null; source = null; node = null;
    },
  };
}

function deviceEars({ onHeard, onHearing, onPartialPhrase, onTrouble }) {
  const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
  if (!Recognition) return null;

  let recognition = null;
  let wanted = false;
  let restartTimer = null;
  let inFlight = "";   // heard, but not yet confirmed by the phone

  function build() {
    const r = new Recognition();
    r.continuous = true;
    r.interimResults = true;
    r.lang = navigator.language || "en-US";

    r.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        const text = (result[0]?.transcript ?? "").trim();
        if (!text) continue;
        if (result.isFinal) {
          trace("heard (settled)", text);
          inFlight = "";
          onHeard(text);
        } else {
          // Held on to, because the phone throws this away if it decides to stop
          // listening before you have finished the sentence.
          inFlight = text;
          onHearing(text);
          onPartialPhrase?.(text);
        }
      }
    };

    // The phone stops listening on its own after a couple of seconds of quiet, and
    // when it does that it silently drops whatever it had half-heard. Pausing in the
    // middle of a question would therefore lose the words you had just said, which
    // looked exactly like it forgetting what you were talking about. So the half-
    // heard words are kept and handed over here, and then it starts listening again.
    r.onstart = () => trace("dictation started");
    r.onend = () => {
      trace("dictation stopped itself", inFlight ? `keeping "${inFlight}"` : "nothing in flight");
      if (inFlight) {
        const leftover = inFlight;
        inFlight = "";
        onHeard(leftover);
      }
      if (wanted) restart(120);
    };
    r.onerror = (event) => {
      trace("dictation error", event.error);
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        wanted = false;
        onTrouble("The phone won't give this page the microphone. Allow it in Safari's settings for this site.");
        return;
      }
      if (event.error === "aborted" || event.error === "no-speech") return;
      onTrouble(`dictation hiccup: ${event.error}`);
    };
    return r;
  }

  function restart(delay = 0) {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => {
      if (!wanted) return;
      try {
        recognition = build();
        recognition.start();
      } catch (err) {
        trace("could not start dictation", err.message ?? err);
        restart(800); // it was still shutting down; try again shortly
      }
    }, delay);
  }

  return {
    start() { wanted = true; restart(0); },
    stop() {
      wanted = false;
      clearTimeout(restartTimer);
      try { recognition?.stop(); } catch {}
      recognition = null;
    },
  };
}

// ------------------------------------------------------------ the phone's mouth
//
// The phone's own voices. Also free. Long answers are broken into sentences and
// spoken one at a time, so that "stop" takes effect within a breath rather than at
// the end of a paragraph, and so nothing hits the phone's limit on how much it will
// say in one go.

// The microphone stays open while it is talking, which means it also hears itself
// coming back off the windscreen. Both voices therefore keep a note of the last few
// sentences they have said, so that what is heard can be checked against what was
// just spoken. That check is what makes it safe to be interrupted mid-sentence.
function recentlySpoken({ keep = 6, forMs = 12_000, now = () => Date.now() } = {}) {
  let said = [];
  const fresh = () => {
    const cutoff = now() - forMs;
    said = said.filter((one) => one.at >= cutoff);
    return said;
  };
  return {
    add(sentence) {
      fresh().push({ sentence, at: now() });
      while (said.length > keep) said.shift();
    },
    // Everything still recent enough to be in the air, as one bag of words.
    get text() { return fresh().map((one) => one.sentence).join(" "); },
    get count() { return fresh().length; },
    clear() { said = []; },
  };
}

// Its own voice coming back is mostly its own words. Yours are not.
// The one word that means "this is for you".
//
// Everything else about telling your voice from its own is a guess with a threshold on
// it, and every threshold is wrong somewhere: too eager and its own answer is cut off
// mid-sentence, too shy and you cannot interrupt at all. This has no threshold. It
// either heard the word or it did not.
//
// It holds only because the app can never say the word itself, which is enforced where
// sentences are made and tested, including when it quotes your own question back.
const WAKE = "hey";
// The spellings dictation actually produces for it. Matching by sound was tried first
// and was far too loose — "how" collided with it, so "how do i start the server" quietly
// lost its first word. A short list of real spellings is exact, and every one of them is
// a word nobody says by accident in a sentence about code.
const SOUNDS_LIKE_WAKE = new Set(["hey", "hay", "hei", "heh"]);

function wantsAttention(heard) {
  // Matched by sound, not by spelling. Dictation writes "hay" about as often as "hey",
  // and they are the same word said out loud — an exact match failed silently every
  // time it guessed the other one, which looks exactly like the app ignoring you.
  return String(heard)
    .toLowerCase()
    .replace(/[^a-z0-9 ]/g, " ")
    .split(/\s+/)
    .some((word) => SOUNDS_LIKE_WAKE.has(word));
}

function meaningfulWords(text) {
  return text.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 3);
}

// Its own voice coming back is mostly its own words. Yours are not.
//
// `whenNothingDistinctive` is the answer for a noise with no real words in it — "mm",
// "yeah", "do it" — and it is deliberately different in the two situations this is
// asked from. While sound is actually in the air, a mumble is far likelier to be the
// echo than an instruction, and a wrongly ignored "mm" costs nothing. Once the sound
// has stopped and we are only waiting out its tail, the same mumble is much likelier
// to be you, and eating a short reply is the misfire people actually notice.
function soundsLikeItself(heard, spoken, { whenNothingDistinctive = true } = {}) {
  if (!spoken) return false;

  const its = new Set(meaningfulWords(spoken));
  const mine = meaningfulWords(heard);
  if (!mine.length) return whenNothingDistinctive;

  const shared = mine.filter((word) => its.has(word)).length;
  return shared / mine.length >= 0.5;
}

// Both voices read the same way: sentence by sentence, so that "stop" takes effect
// within a breath rather than at the end of a paragraph, and so nothing hits the
// limit on how much a phone will say in one go.
function intoSentences(text) {
  const clean = text
    // Never spoken, whatever the answer contains — otherwise hearing itself would be
    // an instruction, and the one unambiguous signal we have stops being unambiguous.
    .replace(/\bhey\b/gi, " ")
    // A web address read out loud is a string of letters, dots and slashes that nobody
    // can hold in their head, let alone write down at seventy miles an hour. It is on
    // the screen in full either way, so this says that it is there and stops.
    .replace(/\bhttps?:\/\/\S+/gi, " the link on screen ")
    .replace(/\b(?:www\.)[^\s]+/gi, " the link on screen ")
    // A file name is the one piece of machinery that has to survive being spoken —
    // somebody has to be able to repeat it out loud to something else. Written out for
    // the voice here rather than in the answer itself, because doing it in the answer
    // ruined the screen: the one place it could be read literally showed the spelled
    // version too, which is unreadable and cannot be copied.
    //
    // Only things that are plainly a name: something with a slash in it, or something
    // ending in a kind of file. A looser rule read ordinary full stops and decimal
    // points out loud as the word "dot", which is worse than not helping at all.
    .replace(
      /(?:\S*\/\S+|\b[\w.-]+\.(?:md|mjs|js|py|json|html|css|txt|yml|yaml|sh|jsonl|log))\b/g,
      (name) =>
        ` ${name
          .replace(/\//g, " slash ")
          .replace(/\./g, " dot ")
          .replace(/-/g, " dash ")
          .replace(/_/g, " underscore ")} `,
    )
    .replace(/```[\s\S]*?```/g, " ")   // spoken code is noise, whatever it says
    .replace(/[*_`#>]/g, " ")          // stray markdown is read out as symbols
    .replace(/\s+/g, " ")
    .trim();
  const parts = [];
  for (const sentence of clean.split(/(?<=[.!?])\s+/)) {
    // A very long sentence still has to be broken somewhere, or it gets cut off.
    if (sentence.length <= 220) { if (sentence) parts.push(sentence); continue; }
    let rest = sentence;
    while (rest.length > 220) {
      const cut = rest.lastIndexOf(" ", 220);
      parts.push(rest.slice(0, cut > 60 ? cut : 220));
      rest = rest.slice(cut > 60 ? cut : 220).trim();
    }
    if (rest) parts.push(rest);
  }
  return parts;
}

function deviceMouth({ voiceName, rate }) {
  const synth = window.speechSynthesis;
  if (!synth) return null;

  let chosen = null;
  let stopThisOne = null;

  function pickVoice() {
    const voices = synth.getVoices();
    if (!voices.length) return null;
    const wanted = (voiceName ?? "").toLowerCase();
    if (wanted) {
      const match = voices.find((v) => v.name.toLowerCase().includes(wanted));
      if (match) return match;
    }
    const language = (navigator.language || "en-US").slice(0, 2);
    // Prefer a voice that lives on the phone: no network, no delay, no cost.
    return (
      voices.find((v) => v.lang.startsWith(language) && v.localService) ??
      voices.find((v) => v.lang.startsWith(language)) ??
      voices[0]
    );
  }

  // The list of voices arrives late on some phones, so ask again when it changes.
  synth.addEventListener?.("voiceschanged", () => { chosen = pickVoice(); });
  chosen = pickVoice();

  return {
    // iPhones stay silent unless the first sound was asked for by a tap, so this is
    // called once from the Start button and the rest of the drive is hands-free.
    unlock() {
      const silent = new SpeechSynthesisUtterance(" ");
      silent.volume = 0;
      synth.speak(silent);
    },

    // One sentence. Settles when the sound genuinely ended — not when a queue emptied,
    // which is what used to be announced and is not the same thing at all. Whoever is
    // above this owns the queue; this owns only the noise.
    sayOne(sentence) {
      return new Promise((resolve) => {
        let settled = false;
        const done = () => {
          if (settled) return;   // the first one through wins
          settled = true;
          stopThisOne = null;
          resolve();
        };
        // Being cut off has to settle it too, or the rest waits behind a sentence
        // nobody is listening to any more. It is also why the cancelled utterance's own
        // late end event now does no harm: it arrives second and is ignored, instead of
        // advancing the queue a second time and cutting the next sentence in half.
        stopThisOne = done;
        const utterance = new SpeechSynthesisUtterance(sentence);
        if (chosen) utterance.voice = chosen;
        utterance.rate = rate ?? 1;
        utterance.onend = done;
        utterance.onerror = done;   // a failed sentence must not strand the rest
        synth.speak(utterance);
      });
    },

    hush() {
      try { synth.cancel(); } catch {}
      stopThisOne?.();
    },
  };
}

// --------------------------------------------------------------- the Mac's voice
//
// A proper voice, generated on the Mac and sent down here a sentence at a time. The
// phone does no talking at all; it just plays what arrives. The next sentence is
// fetched while the current one plays, so the pause is only ever before the first.

function macMouth({ fallback, onTrouble }) {
  let usingFallback = false;
  const ready = new Map();   // a sentence, and the sound for it fetched ahead of time

  async function fetchSound(sentence) {
    const response = await fetch("/say", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text: sentence }),
    });
    if (!response.ok) throw new Error(`the Mac couldn't say that (${response.status})`);
    return response.arrayBuffer();
  }

  return {
    unlock() {
      sound.wake();
      fallback?.unlock();
    },

    // A fresh answer is a fresh chance for the good voice. Without this, one failure
    // early in a drive would mean the plain voice for the rest of it.
    startingAfresh() { usingFallback = false; ready.clear(); },

    // Fetch the next one while this one plays, so the only wait in a long answer is
    // before the first word.
    prepare(sentence) {
      if (usingFallback || ready.has(sentence)) return;
      ready.set(sentence, fetchSound(sentence).catch(() => null));
    },

    // One sentence, and it settles when the sound genuinely stopped. Falling back to
    // the phone's own voice is sticky for the rest of the answer: having failed once,
    // trying again on every sentence would put a pause in front of each of them.
    async sayOne(sentence) {
      if (usingFallback) return fallback?.sayOne(sentence);

      let bytes;
      try {
        const alreadyGoing = ready.get(sentence);
        ready.delete(sentence);
        bytes = await (alreadyGoing ?? fetchSound(sentence));
        if (!bytes) throw new Error("the Mac sent nothing back");
      } catch (err) {
        // The good voice is unreachable. Better a rough voice than silence in a car.
        trace("voice unreachable", err.message ?? err);
        onTrouble?.(String(err.message ?? err));
        usingFallback = true;
        return fallback?.sayOne(sentence);
      }

      try {
        trace("speaking", sentence.slice(0, 60));
        await sound.say(bytes);
      } catch (err) {
        // The channel refused it. Say it some other way rather than appearing to talk
        // while making no sound, which is the worst of both.
        trace("could not play", err.message ?? err);
        onTrouble?.("The phone wouldn't play that, so its own voice is reading it.");
        usingFallback = true;
        return fallback?.sayOne(sentence);
      }
    },

    hush() {
      sound.hush();
      fallback?.hush();
    },
  };
}


// ------------------------------------------------------- one voice, one queue, one ear
//
// Everything this app says goes through here: the answer, "Thinking", every
// confirmation, every error, every announcement. Nothing speaks around it.
//
// It exists because a car on speaker hears the app talking and treats it as somebody
// asking a question. Three things caused that and this holds all three: requests used
// to destroy each other instead of queueing, the end of sound was announced when a
// loop unwound rather than when the noise stopped, and the check against its own voice
// was switched off at exactly the moment its own voice came back — a beat late, off the
// windscreen, after it believed it had finished.
//
// The mouth underneath owes this three things and nothing else: say one sentence, tell
// me when the sound really stopped, and stop now if I say so. Any future voice that can
// do those is covered by these rules rather than needing its own.
function oneVoice({ mouth, settleMs = 900, allowanceFor, onStart, onFinish, now = () => Date.now() }) {
  const waiting = [];
  const said = recentlySpoken();
  let running = false;
  let cutOff = false;
  let deafUntil = 0;

  // How long a sentence could possibly take before we stop believing in it. Sound that
  // never reports finishing must not leave it convinced it is still talking: that would
  // make it deaf for the rest of the drive, which is worse than any echo. Being wrong
  // this way costs a little echo; being wrong the other way costs the drive.
  const allowance = allowanceFor ?? ((sentence) => 5_000 + sentence.length * 120);

  function noLongerThan(promise, ms) {
    return new Promise((resolve) => {
      let settled = false;
      const finish = () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        resolve();
      };
      const timer = setTimeout(() => {
        trace("gave up waiting for the sound to end");
        try { mouth.hush?.(); } catch {}
        finish();
      }, ms);
      promise.then(finish, finish);
    });
  }

  async function drain() {
    if (running) return;
    running = true;
    cutOff = false;
    mouth.startingAfresh?.();
    onStart?.();
    try {
      while (waiting.length && !cutOff) {
        const sentence = waiting.shift();
        // Written down as it starts, because that is when it goes into the air, and it
        // is the air we are trying to recognise later.
        said.add(sentence);
        if (waiting.length) mouth.prepare?.(waiting[0]);
        await noLongerThan(Promise.resolve(mouth.sayOne(sentence)), allowance(sentence));
        // Its own tail is still on its way back. Roll the deaf window forward after
        // every sentence, so a long answer is covered all the way through and for a
        // moment after the last word.
        deafUntil = now() + settleMs;
      }
    } finally {
      // A sentence that ran to its end leaves a tail on its way back, and the moment
      // after it is the moment to be careful. A sentence somebody cut off is the
      // opposite: it stopped because they are talking, so the words that follow are
      // theirs by definition, and being careful with them means throwing them away.
      //
      // That is the fault this fixes. Interrupting a long explanation and then asking
      // about the very thing it was explaining shares most of its words with what it
      // had just said — which is exactly what "that was only my own voice" was looking
      // for. The interruption worked, the talking stopped, and the sentence vanished.
      deafUntil = cutOff ? 0 : now() + settleMs;
      waiting.length = 0;
      cutOff = false;
      running = false;
      // Announced exactly once, whether it finished or was cut off. Announcing it twice
      // is how a queued "Over to you." used to land in the middle of your sentence.
      onFinish?.();
    }
  }

  return {
    unlock() { mouth.unlock?.(); },

    // Asking to speak adds to the end. It does not destroy what is playing — that is a
    // separate, deliberate act with its own name, below.
    speak(text) {
      const parts = intoSentences(text);
      if (!parts.length) return;
      waiting.push(...parts);
      drain();
    },

    silence() {
      cutOff = true;
      waiting.length = 0;
      // Cleared here as well, and not only where the talking unwinds, because being cut
      // off while it was already quiet has to count too — half a second after the last
      // word is still inside the window, and is still somebody talking.
      deafUntil = 0;
      try { mouth.hush?.(); } catch {}
    },

    // Is there sound in the air right now.
    get busy() { return running; },

    // Not talking, but its own last words are still coming back. Anything arriving now
    // is its tail rather than anybody's instruction.
    get settling() { return !running && now() < deafUntil; },

    // Everything recent enough to still be in the air.
    get saying() { return said.text; },

    forget() { said.clear(); deafUntil = 0; },
  };
}


// ----------------------------------------------------------------------- the gate
//
// A car is full of talk that was never meant for the machine, and no amount of
// cleverness reliably tells it apart from talk that was. So nothing is guessed:
// one phrase opens the gate, another closes it, and only what was said in between
// ever reaches Claude. Everything else is heard and thrown away.

// Dictation mishears names constantly — "Claude" comes back as "cloud", "clawed",
// "clod", "cold". Those are not spelling slips, they are the same sounds written
// down differently, so they are compared by sound: keep the first letter, throw away
// the vowels, and group letters made in the same part of the mouth. All four of
// those collapse to the same handful of sounds, and so does whatever your accent
// does to it on a bad day.
function howItSounds(word) {
  const groups = { b: 1, f: 1, p: 1, v: 1, c: 2, g: 2, j: 2, k: 2, q: 2, s: 2, x: 2, z: 2, d: 3, t: 3, l: 4, m: 5, n: 5, r: 6 };
  let key = word[0] ?? "";
  let previous = groups[word[0]] ?? 0;
  for (const letter of word.slice(1)) {
    const group = groups[letter] ?? 0;
    if (group && group !== previous) key += group;
    // Vowels break a run, so "collide" keeps both of its l-sounds; h and w do not.
    if (letter !== "h" && letter !== "w") previous = group;
  }
  return key.slice(0, 4);
}

// `leniently` is only ever true for words after the first one in a phrase. The
// first word is the anchor and has to be earned properly; once it has landed, the
// rest can be given the benefit of the doubt without opening the floodgates.
function nearlySame(heard, wanted, leniently = false) {
  if (heard === wanted) return true;
  // Sound alone is only trustworthy when there is enough sound to go on. Dropping
  // the vowels leaves "this" and "take" identical, which had "this test" waiting to
  // become "take the new page" in the middle of an ordinary sentence. Three sounds
  // is enough to be a name — "claude", "cloud", "clot" and "cold" all share theirs —
  // and two is not enough to be anything.
  const itsSound = howItSounds(wanted);
  if (wanted.length > 3 && itsSound.length >= 3 && howItSounds(heard) === itsSound) return true;

  // "stop" comes back as "stopped", "stopping". The word is in there.
  if (wanted.length >= 3 && heard.startsWith(wanted)) return true;

  // Very short words carry almost no sound to match on, so "go" comes back as
  // "girl", "goal", "gold" and there is no telling them apart.
  if (leniently && wanted.length <= 3) {
    return heard[0] === wanted[0] && heard.length <= wanted.length + 4;
  }

  // A two-letter anchor has nothing to spare: one slip turns "go" into "to", "so",
  // "no" and "do", which read "does it send it to the server" as a command. Words
  // that short have to be exactly right unless they come after the anchor.
  if (!leniently && wanted.length <= 2) return false;

  // Two slips is too many for the first word of a phrase either: it let "with this"
  // be read as "switch to" mid-sentence. The anchor gets one slip and the sound test
  // above; the rest, which only matter once the anchor has landed, keep the benefit
  // of the doubt.
  const allowed = wanted.length <= 5 || !leniently ? 1 : 2;
  if (Math.abs(heard.length - wanted.length) > allowed) return false;

  // How many single-letter changes turn one into the other.
  let previous = Array.from({ length: wanted.length + 1 }, (_, i) => i);
  for (let i = 1; i <= heard.length; i += 1) {
    const row = [i];
    for (let j = 1; j <= wanted.length; j += 1) {
      row[j] = Math.min(
        previous[j] + 1,
        row[j - 1] + 1,
        previous[j - 1] + (heard[i - 1] === wanted[j - 1] ? 0 : 1),
      );
    }
    previous = row;
  }
  return previous[wanted.length] <= allowed;
}

function phraseStartsAt(words, index, phrase) {
  if (index + phrase.length > words.length) return false;
  return phrase.every((wanted, offset) => nearlySame(words[index + offset], wanted, offset > 0));
}

const plainWords = (text) =>
  text.toLowerCase().replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);

// Real speech is full of noise that carries no meaning: "um", "er", and the little
// stalling phrases people say while they think. None of it belongs in a question,
// and none of it should count towards deciding whether a thought is finished — "look
// at the, um" is no more finished than "look at the".
//
// Two kinds, treated differently on purpose. The first are not words at all in any
// sentence, so they come out wherever they appear. The second are ordinary words that
// happen to be used as stalling — "you know the tests fail" means something — so they
// only come out at the very start or the very end of a piece, where they are padding
// rather than sense.
const NOISES = ["um", "umm", "uh", "uhh", "er", "erm", "ah", "hmm", "mm", "mmm", "eh"];
const STALLS = [
  ["you", "know"], ["i", "mean"], ["let's", "see"], ["lets", "see"],
  ["sort", "of"], ["kind", "of"], ["like", "i", "said"], ["well"], ["so"], ["like"],
];

// Keeps the words as they were said — casing, punctuation and all — and only takes
// things out, so what is left reads exactly as it was spoken.
function withoutFiller(text) {
  const bare = (token) => token.toLowerCase().replace(/[^a-z0-9']/g, "");
  let tokens = String(text ?? "").split(/\s+/).filter(Boolean);

  tokens = tokens.filter((token) => {
    const word = bare(token);
    return word ? !NOISES.includes(word) : true;
  });

  // A stall at an end can be followed by another one — "well, you know, the tests" —
  // so both ends are pared back for as long as something keeps coming off.
  const matchesAt = (at, stall) =>
    stall.every((wanted, offset) => bare(tokens[at + offset] ?? "") === wanted);

  let trimming = true;
  while (trimming && tokens.length) {
    trimming = false;
    for (const stall of STALLS) {
      if (tokens.length >= stall.length && matchesAt(0, stall)) {
        tokens = tokens.slice(stall.length);
        trimming = true;
        break;
      }
      if (tokens.length >= stall.length && matchesAt(tokens.length - stall.length, stall)) {
        tokens = tokens.slice(0, tokens.length - stall.length);
        trimming = true;
        break;
      }
    }
  }

  // Taking words out can leave punctuation stranded at the front — ", the tests".
  return tokens.join(" ").replace(/^[\s,;:.!?-]+/, "").trim();
}

// Words that cannot be the last word of anything. Not a list of sentences that count
// as finished — there is no such list — but the other way round: English has a small
// closed set of words whose whole job is to point at something that has not been said
// yet. "Check the tests and" is unfinished because of "and", not because of anything
// about tests. That is what makes this general rather than a set of patterns.
const CANNOT_END = new Set([
  // joining words, which promise another clause
  "and", "or", "but", "so", "because", "if", "when", "while", "though", "although",
  "unless", "until", "than", "whether", "that", "as", "since", "before", "after",
  // pointing words, which promise a thing
  "the", "a", "an", "my", "your", "our", "their", "its", "his", "her", "this",
  "these", "those", "some", "any", "no", "every", "each", "another", "both",
  // words that link to a thing, which promise the thing
  "of", "to", "for", "with", "at", "in", "on", "from", "about", "into", "onto",
  "over", "under", "between", "through", "across", "against", "without", "within",
  "by", "up", "down", "off", "out", "near", "per", "via", "like",
  // helper verbs, which promise the verb that matters
  "is", "are", "was", "were", "am", "be", "been", "being", "do", "does", "did",
  "have", "has", "had", "can", "could", "will", "would", "shall", "should", "may",
  "might", "must", "let", "lets", "let's", "going", "want", "need", "try",
  // question words dangling on their own
  "what", "which", "who", "whom", "whose", "where", "how", "why",
  // very common half-finished endings
  "very", "more", "most", "just", "also", "not", "too", "quite", "really",
]);

// Numbers said as words, because a summary is spoken and "3" read by a phone voice
// lands differently from the rest of the sentence.
const COUNTED = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const inWords = (n) => COUNTED[n] ?? String(n);

// The steps that come in floods and are worth counting rather than listing, and what
// to call a pile of them. Everything else — a command's own description of itself, or
// a line about what it is off to do next — is a sentence already and is kept whole.
const FLOODS = [
  { starts: "reading ", done: "read", pile: (n) => `read ${inWords(n)} files` },
  { starts: "changing ", done: "changed", pile: (n) => `changed ${inWords(n)} files` },
  { starts: "searching for ", done: "searched for", pile: (n) => `ran ${inWords(n)} searches` },
];

/**
 * Everything that happened since the last time it spoke, in one sentence.
 *
 * Saying one step every half minute and dropping the other forty is how a long silence
 * stays a long silence: what gets lost is not the headline but everything underneath
 * it. So the steps are gathered up instead, the repetitive ones counted rather than
 * listed, and the ones that were already a sentence kept as they were.
 *
 * The counting is what makes it sayable. Twenty file reads are one clause — "read
 * eleven files" — and that clause carries more than any one of the twenty would.
 */
function whatHappened(steps) {
  const seen = [];
  for (const step of steps.map((s) => String(s ?? "").trim()).filter(Boolean)) {
    if (seen[seen.length - 1] !== step) seen.push(step);
  }
  if (!seen.length) return "";

  const piles = new Map();   // the counted kind, in the order they first turned up
  const spoken = [];         // the kind that were already a sentence
  for (const step of seen) {
    const flood = FLOODS.find((f) => step.startsWith(f.starts));
    if (!flood) { spoken.push(step); continue; }
    const rest = step.slice(flood.starts.length);
    const pile = piles.get(flood.starts) ?? { flood, things: [] };
    if (!pile.things.includes(rest)) pile.things.push(rest);
    piles.set(flood.starts, pile);
  }

  const parts = [];
  for (const { flood, things } of piles.values()) {
    // One or two of a thing are worth naming; a pile of them is worth counting. The
    // names are the useful part right up until there are too many to hold on to.
    if (things.length === 1) parts.push(`${flood.done} ${things[0]}`);
    else if (things.length === 2) parts.push(`${flood.done} ${things[0]} and ${things[1]}`);
    else parts.push(flood.pile(things.length));
  }

  // Whole sentences go last and only the most recent couple, because the newest is
  // where it has got to and the older ones have been overtaken.
  for (const said of spoken.slice(-2)) parts.push(said.replace(/\.$/, ""));

  const joined = parts.length > 1
    ? `${parts.slice(0, -1).join(", ")}, then ${parts[parts.length - 1]}`
    : parts[0];
  return `${joined.charAt(0).toUpperCase()}${joined.slice(1)}.`;
}

/**
 * Does this sound like a finished thought?
 *
 * Used at a pause, to decide whether it is worth offering to send. A pause on its own
 * is a terrible signal — in a car a pause is someone thinking — but a pause after
 * something that reads as a whole sentence is a good one.
 *
 * Deliberately cautious in one direction only. Saying "not finished" when it was
 * finished costs nothing: the send phrase still works, exactly as it does today.
 * Saying "finished" when it was not costs an interruption, so the test has to be able
 * to say no.
 */
function soundsFinished(text) {
  const raw = String(text ?? "").trim();
  const words = plainWords(withoutFiller(raw));

  // One word is an answer or a fragment, not a thought worth guessing about. Two is
  // the shortest real question there is — "what changed", "any failures".
  if (words.length < 2) return false;

  // Dictation only writes a full stop or a question mark when it was actually spoken
  // or clearly heard, so when one turns up at the end it settles the matter.
  if (/[.?!]$/.test(raw) && !CANNOT_END.has(words[words.length - 1])) return true;

  return !CANNOT_END.has(words[words.length - 1]);
}

/**
 * Is this short enough to be the whole of what somebody meant to say?
 *
 * A pause is read differently depending on how much came before it. Three or four
 * words that stand on their own — "run the tests", "commit that" — are almost always
 * the whole thing: nobody builds a list one breath at a time out of something that
 * short. The same pause after two long sentences is far more often somebody drawing
 * breath in the middle of a third.
 *
 * So this is not a special case for short questions. It is one more piece of evidence
 * about whether more is coming, sitting alongside whether the words read as a finished
 * sentence and what the Mac made of the pause — and the more of those agree, the less
 * time is worth spending waiting to find out.
 *
 * Measured on the whole question so far, not the last breath, because the whole
 * question is what would be sent.
 */
function justAFewWords(text, most = 6) {
  const words = plainWords(withoutFiller(String(text ?? "")));
  // Two, not one. Not out of any idea about sentences — a single word on its own is
  // far more often a stray noise or half of something misheard than anything somebody
  // meant to send, and asking about it is asking about nothing.
  return words.length >= 2 && words.length <= most;
}

/**
 * Reads speech as it arrives and says what to do about it.
 *
 * The phone does not hand over sentences; it hands over whatever it had when you
 * paused. Say "Claude" — pause — "stop", and those arrive as two separate pieces,
 * which is why looking for the phrase inside each piece on its own found nothing and
 * the words fell through as part of the question. So this keeps one running stream
 * across every piece, and when the words at the end could still turn into a phrase
 * once you finish saying it, it holds them back rather than committing them.
 *
 * Gives back {command: "send"} / {say: "..."} in the order they were spoken, so a
 * whole question said in one breath behaves exactly like one said over three.
 *
 * It takes however many commands you give it — {send: "all done", ...} — because
 * there was never anything special about there being two of them.
 */
// Words people put in front of an instruction without meaning anything by them.
// "Can you switch to the voice app" is an instruction, not a sentence about
// switching — but the words "can you" sit in front of it, so a command that only
// counts at the very start does not count at all. These are skipped over when
// deciding whether something was said at the front.
const POLITENESS = new Set([
  "can", "could", "would", "will", "please", "you", "we", "lets", "let's", "let",
  "ok", "okay", "right", "now", "so", "and", "then", "hey", "just", "maybe",
  "actually", "um", "uh", "er", "well", "i", "want", "need", "wanna", "like",
  "no", "yes", "yeah", "to", "still", "wanted", "gonna", "going", "try", "trying",
]);

// `wake` is spelled out here rather than reached for, so this can be lifted out and
// exercised on its own — which is how it is tested. The two spellings are checked
// against each other, because a silent disagreement would mean commands that never fire.
function makePhraseReader(phrases, { wake = ["hey", "hay", "hei", "heh"], alwaysAllowed = ["send"] } = {}) {
  const addressedWith = new Set(Array.isArray(wake) ? wake : [wake]);
  const saidToUs = (word) => addressedWith.has(word);
  // Each command may have several wordings; any of them means the same thing.
  // Longest first, so that when one wording begins like another the longer reading
  // wins rather than the shorter one swallowing its first words.
  const commands = Object.entries(phrases)
    .flatMap(([name, said]) =>
      (Array.isArray(said) ? said : [said]).map((phrase) => ({ name, words: plainWords(phrase) })))
    .sort((a, b) => b.words.length - a.words.length);
  let pending = [];

  // Could these last few words still become the phrase, once more words arrive?
  function mightBecome(words, at, phrase) {
    if (words.length - at >= phrase.length) return false;
    for (let k = 0; at + k < words.length; k += 1) {
      if (!nearlySame(words[at + k], phrase[k], k > 0)) return false;
    }
    return true;
  }

  return {
    feed(text) {
      pending.push(...plainWords(text));
      const steps = [];
      let spoken = [];
      const flush = () => {
        if (spoken.length) steps.push({ say: spoken.join(" ") });
        spoken = [];
      };

      let i = 0;
      while (i < pending.length) {
        const found = commands.find((c) => phraseStartsAt(pending, i, c.words));

        // Where it was said matters as much as what was said. People give an
        // instruction at the start of a breath or at the end of one — "all done",
        // "work on the voice app", "...and check the tests, that's it". In the
        // middle of a sentence the same words are just words: "does it send it to
        // the server", "can you work on the login bug". So a phrase only counts at
        // an edge, and everything buried inside a sentence stays part of it.
        //
        // This is worth more than any amount of cleverness about which words to
        // listen for, because it does not depend on the words at all — as long as
        // "the start" means what a person means by it, politeness included.
        // You have to address the machine before instructing it. Nothing counts as an
        // instruction unless the word comes first, with nothing but politeness between.
        //
        // This replaces a judgement with a fact. Everything before rested on deciding
        // whether words were meant for the machine, and no rule about where they sat in
        // a sentence got it right: "can you read the commands to me" read them out, and
        // the app's own "over to you" sent the question for you. Being addressed is not
        // a better guess — it removes the guess.
        //
        // A missed word is harmless on purpose: the instruction simply stays part of the
        // question. Failing towards nothing-happened is right; the other way does
        // something nobody asked for.
        let spokeToUsAt = -1;
        for (let k = i - 1; k >= 0; k -= 1) {
          const word = pending[k];
          if (saidToUs(word)) {
            spokeToUsAt = k;
            break;
          }
          if (!POLITENESS.has(word)) break;
        }
        const addressed = spokeToUsAt >= 0;

        // Sending is the one exception, because it is said several times a minute and
        // having to address it every time would be the difference between this being
        // usable and not. It is safe to exempt only because the app is now deaf while it
        // is talking — its own "over to you" cannot get back in.
        const saidConstantly = alwaysAllowed.includes(found?.name);
        const onlyPolitenessBefore = pending.slice(0, i).every((word) => POLITENESS.has(word));
        const atAnEdge = onlyPolitenessBefore || i + found?.words.length === pending.length;

        // A command that needs a name after it does not need the edge rule at all,
        // and this is the point: the edge rule exists because a bare phrase is
        // ambiguous, and a phrase followed by the name of one of your own projects
        // is not. "Can you work on the login bug" cannot switch anywhere, because
        // there is no such project; "no I want to switch to the voice app" plainly
        // can, wherever in the sentence it sits.
        //
        // Guessing which words count as throat-clearing has now failed three times —
        // "can you", then "ok so could you please", then "no I want to". Each fix
        // was a longer list, which is not a fix. This removes the guess for the one
        // command where something better is available.
        const said = found && (addressed || (saidConstantly && atAnEdge)) ? found : null;

        if (said) {
          // The word, and the politeness around it, were never part of a question. They
          // go with the instruction rather than into what Claude is asked — otherwise
          // every instruction would leave a stray "hey" behind in the question.
          // Everything from the word onwards goes with the instruction rather than into
          // the question — the politeness in between included, since "hey could you
          // please" was never part of what you were asking. The word itself is already
          // gone by here, hence the one less.
          if (addressed) spoken = spoken.slice(0, spoken.length - (i - spokeToUsAt - 1));
          else if (onlyPolitenessBefore) spoken = [];
          flush();
          // It reports the words it swallowed, so a command that turns out not to
          // have been one can be put back into the question exactly as spoken.
          steps.push({ command: said.name, spokenAs: pending.slice(i, i + said.words.length).join(" ") });
          i += said.words.length;
          continue;
        }
        // The rest of a phrase may still be on its way, so hold these back rather
        // than letting them fall through into the question.
        if (commands.some((c) => mightBecome(pending, i, c.words))) break;

        // The word that gets our attention never becomes part of the question, and it
        // has to survive the gap between one breath and the next: said at the end of a
        // piece of speech, with the instruction arriving in the following one, it used
        // to be flushed out on its own and leave the instruction unaddressed a moment
        // later — so the instruction quietly did nothing.
        //
        // So it is held while the words after it could still become an instruction, and
        // simply dropped once they plainly cannot. Dropped rather than passed on: it was
        // addressed to the app either way, and it was never part of the question.
        const word = pending[i];
        if (saidToUs(word)) {
          const roomLeft = pending.length - (i + 1);
          const couldStillBeOne =
            roomLeft < commands[0].words.length &&
            (roomLeft === 0 || commands.some((c) => mightBecome(pending, i + 1, c.words)));
          if (couldStillBeOne) break;
          i += 1;
          continue;
        }

        spoken.push(pending[i]);
        i += 1;
      }

      flush();
      pending = pending.slice(i);
      return steps;
    },
    // What is being held back, so it can still be shown while you say it.
    held: () => pending.join(" "),
  };
}

// One piece of speech on its own, for when there is no stream to keep.
function readAsInstructions(text, phrases) {
  const reader = makePhraseReader(phrases);
  const steps = reader.feed(text);
  const held = reader.held();
  if (held) steps.push({ say: held });
  return steps;
}

// ------------------------------------------------------------------------ sound
//
// Every sound the page makes goes through here, and the reason is the iPhone: a page
// may only make sound through a channel opened by a real tap. Opening one lazily,
// the first time something wants to be heard, gets it silently refused — and a phone
// that thinks it is talking while making no sound is impossible to diagnose from the
// driver's seat. So exactly one channel is opened by the Start button, and both the
// notes and the voice go down it.

// The notes, built as real sounds so they can go out the same way the voice does.
// A phone will not play something it was not asked for by a tap, and it silences
// anything it thinks is decoration — so these are made here rather than synthesised
// on the channel that the mute switch turns off.
const RATE = 8000;

function wavFromSamples(samples) {
  const bytes = new Uint8Array(44 + samples.length);
  const view = new DataView(bytes.buffer);
  const ascii = (at, text) => [...text].forEach((c, i) => view.setUint8(at + i, c.charCodeAt(0)));
  ascii(0, "RIFF");
  view.setUint32(4, 36 + samples.length, true);
  ascii(8, "WAVEfmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);          // plain, uncompressed
  view.setUint16(22, 1, true);          // one channel
  view.setUint32(24, RATE, true);
  view.setUint32(28, RATE, true);
  view.setUint16(32, 1, true);
  view.setUint16(34, 8, true);          // eight bits is plenty for a blip
  ascii(36, "data");
  view.setUint32(40, samples.length, true);
  bytes.set(samples, 44);

  let text = "";
  for (const byte of bytes) text += String.fromCharCode(byte);
  return `data:audio/wav;base64,${btoa(text)}`;
}

// One blip: a tone sliding from one pitch to another, faded in and out so it does
// not click. A click in a headset at seventy miles an hour is startling.
function blip(from, to, ms, loudness = 0.35) {
  const count = Math.round((RATE * ms) / 1000);
  const samples = new Uint8Array(count);
  let phase = 0;
  for (let i = 0; i < count; i += 1) {
    const along = i / count;
    const pitch = from + (to - from) * along;
    phase += (2 * Math.PI * pitch) / RATE;
    const fade = Math.min(1, along * 12, (1 - along) * 12);
    samples[i] = 128 + Math.round(Math.sin(phase) * 127 * loudness * fade);
  }
  return samples;
}

function silenceFor(ms) {
  return new Uint8Array(Math.round((RATE * ms) / 1000)).fill(128);
}

const NOTES = {};
function toneFor(which, shape) {
  if (NOTES[which]) return NOTES[which];
  const pieces = [];
  // The two that repeat on a clock are shorter and softer than the ones that mark
  // something happening, because anything you hear every ten seconds has to stay
  // underneath the drive rather than on top of it.
  const onAClock = which === "working" || which === "waiting";
  shape.forEach(([from, to], i) => {
    if (i) pieces.push(silenceFor(40));
    pieces.push(blip(from, to, onAClock ? 90 : 130, onAClock ? 0.18 : 0.35));
  });
  const total = pieces.reduce((n, piece) => n + piece.length, 0);
  const all = new Uint8Array(total);
  let at = 0;
  for (const piece of pieces) { all.set(piece, at); at += piece.length; }
  NOTES[which] = wavFromSamples(all);
  return NOTES[which];
}

// A tenth of a second of real silence. Used once, from the tap, to open the media
// channel — an empty or malformed sound gets refused and the channel stays shut.
const OPENING_SOUND =
  "data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";

const sound = {
  channel: null,   // the notes
  player: null,    // the voice
  notes: null,     // the little sounds
  finish: null,    // how to end the sentence being played, if it is cut off
  // Set when the browser turns down the request to make sound. This is the one
  // failure that is invisible from the inside — the page is told it played, and it
  // did, into nothing — so it is written down here and turned into a visible ask.
  refused: false,

  // Opening the channel used to be possible only from a tap. It is tried without one
  // now, and a browser that says no sets `refused` rather than failing quietly.
  wake() {
    // Tells the phone this page is a thing you are listening to, not a decoration.
    // Without it, everything here is silenced by the mute switch on the side of the
    // phone — which looks exactly like broken code from the inside, because the page
    // is told the sound played and it did, into nothing.
    //
    // And this is also where a whole night went. Telling a phone the page is for
    // playing sound tells it, in the same breath, that the page does not record — so
    // the microphone is refused, flatly, and the refusal blames the state of the page
    // rather than saying anything about recording. Certificates, taps, addresses and
    // other listeners were all investigated first; this one line was the answer the
    // whole time.
    //
    // So when this Mac is doing the hearing, the page says it both plays and records,
    // which is what it actually does.
    try {
      if (navigator.audioSession) {
        navigator.audioSession.type = setup.earOnTheMac ? "play-and-record" : "playback";
        trace("audio session", navigator.audioSession.type);
      } else {
        trace("audio session", "not offered by this phone");
      }
    } catch (err) {
      trace("audio session refused", err.message ?? err);
    }

    try {
      this.channel ??= new (window.AudioContext ?? window.webkitAudioContext)();
      if (this.channel.state === "suspended") this.channel.resume();
      trace("sound channel", this.channel.state);
    } catch (err) {
      trace("sound channel refused", err.message ?? err);
    }

    // And the media channel, which is what music and video use and what the mute
    // switch leaves alone. It only opens if the first thing played is real audio
    // asked for by a tap, so a tenth of a second of genuine silence is played here.
    try {
      this.player ??= new Audio();
      this.player.preload = "auto";
      this.player.src = OPENING_SOUND;
      this.player.play().then(
        () => { this.refused = false; trace("media channel", "open"); },
        (err) => { this.refused = true; trace("media channel refused", err.message ?? err); },
      );

      // The notes get their own, so that a note never cuts a sentence in half.
      this.notes ??= new Audio();
      this.notes.preload = "auto";
      this.notes.src = OPENING_SOUND;
      this.notes.play().catch(() => {});
    } catch (err) {
      trace("media channel refused", err.message ?? err);
    }
  },

  get awake() { return Boolean(this.player); },

  // The notes. They are built here as real sounds rather than played through the
  // other channel, so that they go out the same way the voice does — the way the
  // mute switch leaves alone. A note you cannot hear is worse than no note.
  note(which) {
    const shapes = {
      sent: [[520, 780], [780, 990]],   // gone: two rising blips
      ready: [[880, 660]],              // an answer is about to be read
      working: [[300, 300]],            // still going, quietly
      wiped: [[700, 380]],              // that has been thrown away
      // Your turn: a bare yes or no lands right now. Two flat notes at the same
      // pitch, which nothing else here does — every other note slides, so this one
      // is recognisable without being listened for.
      listening: [[880, 880], [880, 880]],
      // And the window has shut again. Deliberately the same two notes falling away,
      // so it is plainly the end of the thing the double note began.
      tooLate: [[880, 620]],
      // You turned an offer down. Nothing is being asked of you and nothing has
      // happened, so this is the quietest thing here: one low note falling away,
      // below everything else, which is what "never mind, carry on" sounds like.
      declined: [[380, 280]],
      // Nothing recorded and nobody talking: a reminder that it is still listening.
      // Flat, like the still-working note, because the two mean the same kind of
      // thing — I am here — and only the pitch says which of them it is.
      waiting: [[660, 660]],
    };
    const shape = shapes[which];
    if (!shape || !this.notes) return;
    try {
      this.notes.src = toneFor(which, shape);
      this.notes.play().catch(() => {});
    } catch {
      // A missing note is a small loss; it must never stop the conversation.
    }
  },

  /**
   * Play a piece of speech. Resolves when it has finished, or when it is cut off.
   *
   * This goes down the media channel rather than the other one, because the mute
   * switch silences that one and nobody remembers which way the switch is.
   */
  say(bytes) {
    if (!this.player) return Promise.reject(new Error("no sound channel — press start first"));

    const url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
    return new Promise((resolve, reject) => {
      let settled = false;
      const done = (err) => {
        if (settled) return;
        settled = true;
        this.finish = null;
        URL.revokeObjectURL(url);
        if (err) reject(err); else resolve();
      };
      // Being cut off has to end this too, or the rest of the answer waits behind a
      // sentence nobody is listening to any more.
      this.finish = () => done();
      this.player.onended = () => done();
      this.player.onerror = () => done(new Error("the phone refused to play it"));
      this.player.src = url;
      this.player.play().catch((err) => done(err));
    });
  },

  hush() {
    try { this.player?.pause(); } catch {}
    this.finish?.();
  },
};


// ------------------------------------------------------------- the free front end

function splitFrontEnd() {
  // Things to do the moment it stops talking. There is no other way to know: the
  // voice is queued sentence by sentence and a long answer takes as long as it takes,
  // so anything that has to land after the last word has to wait to be called.
  let whenQuiet = [];
  const talking = {
    onStart: () => paint(),
    onFinish: () => {
      paint();
      idleState();
      const waiting = whenQuiet;
      whenQuiet = [];
      for (const then of waiting) then();
    },
  };

  // The phone's own voice is either the choice or the safety net, depending on what
  // the Mac says it is doing.
  // When the voice was last bought back by a tap, so a second tap moments later can be
  // read as checking rather than as an order to be quiet.
  let soundCameBackAt = 0;

  const phoneVoice = deviceMouth({
    voiceName: setup.speaker === "mac" ? "" : setup.speakerVoice,
    rate: setup.speakerRate,
  });
